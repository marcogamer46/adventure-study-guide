<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure OS — study desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>/* ==========================================================================
   ADVENTURE OS — a desktop environment for the Adventure Workbench
   The Velvet Expedition design system, re-cast as an operating system.
   ========================================================================== */

/* ---------- 1. Tokens & themes ---------- */
:root{
  color-scheme:dark;
  --os-bg:#0a0e1c;
  --os-bg2:#0f1424;
  --os-wall1:#0d1330;
  --os-wall2:#0a0e1c;
  --win:#141b30;
  --win2:#1a2240;
  --win3:#202a4c;
  --panel:#10162a;
  --fg:#e8e6dc; --fg2:#9aa3bd; --fg3:#6d7694;
  --line:#2a3352; --line2:#39446a;
  --accent:#d99a3d; --accent2:#e9b45c; --accent-ink:#181106;
  --amber:#edbe66; --amber-ink:#2a1e05;
  --red:#e0634b; --red-ink:#2a120c;
  --blue:#70a4d0; --blue-ink:#0d1c29;
  --violet:#b89bd9; --violet-ink:#1e1431;
  --term:#57e6b5; --term-ink:#06251a; --term-dim:#2e8f6d;
  --shadow:0 22px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --shadow-sm:0 6px 20px rgba(0,0,0,.4);
  --ring:#e9b45c;
  --radii:14px;
  --wallpaper:radial-gradient(1200px 700px at 78% 8%, rgba(217,154,61,.10), transparent 55%),
               radial-gradient(900px 600px at 12% 90%, rgba(112,164,208,.08), transparent 55%),
               linear-gradient(160deg,var(--os-wall1),var(--os-wall2) 70%);
}
:root[data-theme="light"]{
  color-scheme:light;
  --os-bg:#e8e0d0; --os-bg2:#f0e9db;
  --os-wall1:#e3d9c4; --os-wall2:#ece4d3;
  --win:#fffdf8; --win2:#f7f1e4; --win3:#efe7d7;
  --panel:#faf5ea;
  --fg:#1b2333; --fg2:#59637c; --fg3:#8b93a8;
  --line:#dcd2bf; --line2:#c9bda4;
  --accent:#b5792e; --accent2:#8e5c22; --accent-ink:#fffaf0;
  --amber:#c98f2b; --amber-ink:#3a2a08;
  --red:#c1432b; --red-ink:#fff5f0;
  --blue:#265f8a; --blue-ink:#eff6fb;
  --violet:#6d4f96; --violet-ink:#f6f1fb;
  --term:#14795a; --term-ink:#eaffe6; --term-dim:#1c7a5c;
  --shadow:0 22px 60px rgba(60,50,30,.2), 0 2px 8px rgba(60,50,30,.12);
  --shadow-sm:0 6px 20px rgba(60,50,30,.14);
  --ring:#8e5c22;
  --wallpaper:radial-gradient(1200px 700px at 78% 8%, rgba(181,121,46,.10), transparent 55%),
               radial-gradient(900px 600px at 12% 90%, rgba(38,95,138,.07), transparent 55%),
               linear-gradient(160deg,var(--os-wall1),var(--os-wall2) 70%);
}

/* ---------- 2. Reset & base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  font-family:"Karla",system-ui,-apple-system,sans-serif;
  font-size:15.5px; line-height:1.58;
  color:var(--fg); background:var(--os-bg);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.9em;padding:.1em .3em;border-radius:5px;background:color-mix(in srgb,var(--fg) 10%,transparent);border:1px solid var(--line)}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
::-webkit-scrollbar-track{background:transparent}

/* ==========================================================================
   3. BOOT SCREEN
   ========================================================================== */
#boot{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 50% 30%, #10162a, #070a14 75%);
  transition:opacity .55s ease;
}
#boot.done{opacity:0;pointer-events:none}
.bootbox{width:min(560px,88vw);padding:34px;border:1px solid #232d4f;border-radius:18px;background:rgba(16,22,42,.7);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bootlog{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#8fa4d9;height:176px;overflow:hidden;margin-bottom:18px}
.bootlog .ok{color:#57e6b5}
.bootlog .dim{color:#56618a}
.bootbar{height:6px;border-radius:6px;background:#1d2745;overflow:hidden}
.bootbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .3s ease}
.bootmeta{display:flex;justify-content:space-between;margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#56618a}
.bootskip{position:absolute;bottom:26px;right:28px;border:1px solid #2a3557;background:transparent;color:#8fa4d9;padding:8px 16px;border-radius:999px;font-size:13px}
.bootskip:hover{border-color:var(--accent);color:var(--accent)}

/* ==========================================================================
   4. DESKTOP
   ========================================================================== */
#desktop{position:fixed;inset:0;background:var(--wallpaper)}
#contours{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
#contours path{fill:none;stroke:#d99a3d;stroke-width:1.1;opacity:.16}
:root[data-theme="light"] #contours path{stroke:#b5792e;opacity:.14}

/* desktop icons */
#icons{
  position:absolute;top:18px;left:18px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:6px;width:min(260px,calc(100% - 90px));
}
.dicon{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 6px;border-radius:12px;border:1px solid transparent;
  color:var(--fg);text-align:center;user-select:none;
  transition:background .14s ease,border-color .14s ease,transform .1s ease;
}
.dicon:hover{background:rgba(255,255,255,.06)}
.dicon:active{transform:scale(.96)}
.dicon .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,#1c2548,#121a33);border:1px solid #2c3860;box-shadow:0 6px 16px rgba(0,0,0,.35);color:var(--accent)}
.dicon span{font-size:12.5px;line-height:1.25;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.dicon .ico svg{width:26px;height:26px}

/* wallpaper credits / status */
.wallclock{position:absolute;top:20px;right:24px;text-align:right;color:var(--fg);text-shadow:0 1px 3px rgba(0,0,0,.6);user-select:none}
.wallclock b{display:block;font-family:"Playfair Display",serif;font-size:30px;line-height:1.05}
.wallclock span{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}

/* ==========================================================================
   5. WINDOWS
   ========================================================================== */
.win{
  position:absolute;min-width:320px;min-height:200px;
  background:var(--win);border:1px solid var(--line2);border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:scale(.96) translateY(8px);
  transition:opacity .18s ease,transform .18s ease;
}
.win.open{opacity:1;transform:none}
.win.max{width:100%!important;height:calc(100% - 56px)!important;top:0!important;left:0!important;border-radius:0;border:none}
.win.min{display:none}
.win.focus{border-color:color-mix(in srgb,var(--accent) 42%,var(--line2));box-shadow:var(--shadow)}
.win-titlebar{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;flex:none;
  background:linear-gradient(180deg,var(--win3),var(--win2));
  border-bottom:1px solid var(--line);
  border-radius:14px 14px 0 0;
  touch-action:none;
}
.win.focus .win-titlebar{background:linear-gradient(180deg,var(--win3),var(--win2))}
.win-titlebar .t-ico{width:18px;height:18px;color:var(--accent);display:grid;place-items:center;flex:none}
.win-titlebar .t-ico svg{width:16px;height:16px}
.win-titlebar .t-title{font-weight:700;font-size:13.5px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--fg)}
.win-ctl{display:flex;gap:6px;flex:none}
.win-ctl button{
  width:20px;height:20px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--fg2);
  display:grid;place-items:center;font-size:11px;line-height:1;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.win-ctl button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.win-ctl .btn-close:hover{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.win-body{flex:1;overflow:auto;position:relative;min-height:0}
.win-body > .app{padding:0}

/* ==========================================================================
   6. TASKBAR
   ========================================================================== */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:56px;z-index:900;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:color-mix(in srgb,var(--panel) 86%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
#startbtn{
  display:flex;align-items:center;gap:9px;
  padding:7px 14px;border-radius:10px;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:var(--accent-ink);font-weight:700;font-size:14px;
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 38%,transparent);
}
#startbtn .slogo{font-family:"Playfair Display",serif;font-weight:800;font-size:17px;line-height:1}
#startbtn:hover{filter:brightness(1.06)}
#tasks{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:thin}
.taskbtn{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--win2);color:var(--fg2);font-size:12.5px;font-weight:600;
  white-space:nowrap;max-width:180px;
}
.taskbtn .t-ico{width:14px;height:14px;color:var(--accent)}
.taskbtn .t-ico svg{width:13px;height:13px}
.taskbtn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.taskbtn.active .t-ico{color:var(--accent-ink)}
.taskbtn:hover{border-color:var(--accent);color:var(--fg)}
#tray{display:flex;align-items:center;gap:6px;flex:none}
.traybtn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--win2);color:var(--fg2);display:grid;place-items:center;
  font-size:15px;transition:border-color .12s ease;
}
.traybtn:hover{border-color:var(--accent)}
#clockbox{text-align:right;padding:0 6px;line-height:1.2;user-select:none}
#clockbox b{display:block;font-size:13.5px;font-weight:700}
#clockbox span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--fg2)}

/* boot menu */
#startmenu{
  position:fixed;left:10px;bottom:64px;width:min(360px,94vw);z-index:10001;
  background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  box-shadow:var(--shadow);padding:14px;display:none;
}
#startmenu.open{display:block}
#startmenu h4{margin:4px 8px 8px;font-family:"Playfair Display",serif;font-size:16px;color:var(--fg)}
.sm-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--fg);border:1px solid transparent;width:100%;text-align:left;
}
.sm-item:hover{background:var(--win2);border-color:var(--line)}
.sm-item .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(150deg,#1c2548,#121a33);border:1px solid #2c3860;color:var(--accent)}
.sm-item .ico svg{width:17px;height:17px}
.sm-item small{display:block;font-weight:500;color:var(--fg2);font-size:12px}
.sm-sep{height:1px;background:var(--line);margin:8px 4px}

/* ==========================================================================
   7. APP: ATLAS (expeditions)
   ========================================================================== */
.app-pad{padding:22px 24px}
.app-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:640;margin:0 0 4px;letter-spacing:-.01em}
.app-sub{color:var(--fg2);margin:0 0 18px;max-width:60ch}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.exp-card{
  text-align:left;padding:16px;border-radius:13px;border:1px solid var(--line);
  background:var(--win2);display:flex;flex-direction:column;gap:6px;
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;
}
.exp-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow-sm)}
.exp-num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.exp-card h3{margin:0;font-size:16px;color:var(--fg);line-height:1.25}
.exp-card p{margin:0;font-size:13px;color:var(--fg2);line-height:1.45}
.exp-card .exp-open{margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--accent)}

/* ==========================================================================
   8. APP: LESSON
   ========================================================================== */
#lesson-scroll{padding:26px 30px 40px;max-width:920px}
.lesson-hero{font-family:"Playfair Display",serif;font-size:20px;font-weight:600;color:var(--accent);margin:2px 0 14px;line-height:1.3}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.ccard{background:var(--win2);border:1px solid var(--line);border-radius:13px;padding:16px}
.ccard .kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ccard .gterm{font-family:"Playfair Display",serif;font-size:17px;font-weight:640;color:var(--fg);margin:5px 0 6px;display:block}
.ccard p{margin:0;font-size:13.5px;color:var(--fg2)}
.ccard details{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.ccard details summary{cursor:pointer;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--accent);list-style:none}
.ccard details summary::-webkit-details-marker{display:none}
.ccard details .body{padding:0 12px 10px;font-size:13px;color:var(--fg2)}
.bodyblock{margin:16px 0}
.bodyblock h3{font-family:"Playfair Display",serif;font-size:19px;font-weight:600;margin:0 0 6px}
.bodyblock p{margin:0;color:var(--fg)}
.steps{margin:12px 0;padding:0;counter-reset:step;list-style:none}
.steps li{counter-increment:step;position:relative;padding:10px 12px 10px 46px;background:var(--win2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px}
.steps li::before{content:counter(step);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700}
.tick{margin:8px 0;padding:0;list-style:none}
.tick li{position:relative;padding:5px 0 5px 26px;font-size:14px}
.tick li::before{content:"";position:absolute;left:4px;top:12px;width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:2px}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--win2);border-radius:0 12px 12px 0;padding:14px 18px;margin:16px 0}
.callout .cttl{font-weight:800;display:block;margin-bottom:4px}
.callout.analogy{border-left-color:var(--blue)}
.callout.danger{border-left-color:var(--red)}
.callout .sym{float:left;font-size:20px;margin-right:10px;line-height:1.3}
.checklist{border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:18px;background:var(--win2);margin-top:24px}
.checklist h3{font-family:"Playfair Display",serif;margin:0 0 12px;font-size:18px}
.checks{display:grid;grid-template-columns:1fr;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.check .qmark{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);display:grid;place-items:center;font-family:"Playfair Display",serif;font-weight:700;flex:none}
.check p{margin:0;font-size:14px}

/* ==========================================================================
   9. APP: CODE IDE
   ========================================================================== */
.ide-wrap{display:flex;flex-direction:column;height:100%}
.ide-tabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.ide-tab{
  display:flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:9px 9px 0 0;border:1px solid transparent;
  background:transparent;color:var(--fg2);font-size:12.5px;font-weight:600;
  border-bottom:none;white-space:nowrap;
}
.ide-tab:hover{color:var(--fg)}
.ide-tab.active{background:var(--win);color:var(--fg);border-color:var(--line)}
.ide-tab .dot{width:8px;height:8px;border-radius:3px;background:var(--accent)}
.ide-body{flex:1;display:flex;min-height:0}
.ide-code{flex:1;overflow:auto;padding:14px 16px;background:var(--win);font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.65}
.ide-note{width:280px;flex:none;border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto;font-size:13.5px;color:var(--fg2)}
.ide-note h4{margin:0 0 8px;font-family:"Playfair Display",serif;font-size:16px;color:var(--fg)}
.code-line{display:inline}
.ln{display:inline-block;min-width:2.2em;text-align:right;color:var(--fg3);user-select:none;margin-right:14px}
.tok-com{color:var(--fg3);font-style:italic}
.tok-str{color:var(--accent2)}
.tok-num{color:var(--violet)}
.tok-kw{color:var(--blue);font-weight:700}
.tok-bi{color:var(--red);font-weight:700}
/* ==========================================================================
   10. APP: TERMINAL
   ========================================================================== */
#term{display:flex;flex-direction:column;height:100%;background:#070b14;font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--term);padding:14px 16px;overflow-y:auto}
#term .line{white-space:pre-wrap;word-break:break-word;line-height:1.5}
#term .p{color:#7fb4e8}
#term .path{color:#8fa4d9}
#term .dim{color:#3a5070}
#term .err{color:#e0634b}
#term .ok{color:#57e6b5}
#term .head{font-weight:700;font-size:14px;color:#e8e6dc}
#term input{background:transparent;border:none;outline:none;color:var(--term);font:inherit;flex:1}
#term .line-input{display:flex;align-items:center;gap:6px}
#term pre.ascii{margin:6px 0;line-height:1.15;color:#8fdcc0}
#term .helpgrid{display:grid;grid-template-columns:150px 1fr;gap:2px 14px;margin:6px 0}
#term .helpgrid b{color:#e8e6dc}

/* ==========================================================================
   11. APP: TERRAIN LAB
   ========================================================================== */
.lab-wrap{padding:22px 24px}
.lab-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:16px}
.lab-field{display:flex;flex-direction:column;gap:4px}
.lab-field label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
.lab-field select,.lab-field input{background:var(--win2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:7px 10px;font:inherit;font-size:13.5px;accent-color:var(--accent)}
.lab-field select:focus,.lab-field input:focus{outline:none;border-color:var(--accent)}
.lab-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:none;border-radius:9px;padding:9px 18px;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.lab-btn:hover{filter:brightness(1.06)}
.lab-canvas-wrap{background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto}
#labCanvas{width:100%;height:auto;border-radius:8px}
.lab-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lab-stats span{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.lab-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12.5px;color:var(--fg2)}
.lab-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ==========================================================================
   12. APP: REFEREE (quiz)
   ========================================================================== */
.quiz-wrap{padding:24px 28px;max-width:680px}
.quiz-progress{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin:14px 0 20px}
.quiz-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
.quiz-q{margin-bottom:18px}
.quiz-q .qtitle{font-weight:700;font-size:16px;margin-bottom:10px}
.quiz-q label{display:block;padding:9px 13px;border-radius:9px;border:1px solid var(--line);margin:6px 0;cursor:pointer;transition:background .12s ease,border-color .12s ease;font-size:14px}
.quiz-q label:hover{background:var(--win2)}
.quiz-q input{margin-right:9px;accent-color:var(--accent)}
.quiz-q .reveal{display:none;margin-top:10px;padding:11px 14px;border-radius:9px;border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));font-size:13.5px}
.quiz-q.correct .reveal{display:block;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--fg)}
.quiz-q.wrong .reveal{display:block;background:color-mix(in srgb,var(--red) 10%,var(--panel));border-color:color-mix(in srgb,var(--red) 45%,var(--line));color:var(--fg)}
.quiz-q.correct label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.quiz-q.wrong label:has(input:checked){border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel))}
.quiz-score{border:1px dashed var(--accent);border-radius:14px;padding:20px;text-align:center;background:var(--win2)}
.quiz-score .big{font-family:"Playfair Display",serif;font-size:44px;font-weight:700;color:var(--accent)}
.quiz-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:none;border-radius:9px;padding:10px 20px;font-weight:700;margin-top:14px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}

/* ==========================================================================
   13. APP: GLOSSARY
   ========================================================================== */
.gloss-wrap{padding:22px 26px}
.gloss-search{width:100%;background:var(--win2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;margin-bottom:16px}
.gloss-search:focus{outline:none;border-color:var(--accent)}
.gloss-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gterm-card{background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gterm-card b{display:block;font-family:"Playfair Display",serif;font-size:16px;color:var(--accent);margin-bottom:4px}
.gterm-card p{margin:0;font-size:13.5px;color:var(--fg2)}

/* ==========================================================================
   14. APP: PIPELINE
   ========================================================================== */
.pipe-wrap{padding:24px 28px;max-width:720px}
.pipe-flow{display:flex;flex-direction:column;gap:0;margin:18px 0}
.pipe-step{display:flex;align-items:center;gap:14px;background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.pipe-step .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-family:"IBM Plex Mono",monospace;flex:none}
.pipe-step .t{font-weight:700;font-size:15px}
.pipe-step small{display:block;color:var(--fg2);font-size:12.5px}
.pipe-arrow{align-self:center;padding:3px 0 3px 26px;color:var(--accent);font-size:18px}
.pipe-arrow::before{content:"↓"}
.pipe-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pipe-stat{flex:1;min-width:120px;background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.pipe-stat b{display:block;font-family:"Playfair Display",serif;font-size:26px;color:var(--accent)}
.pipe-stat span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}

/* ---------- additions for lesson kinds & quiz footer ---------- */
.callout .co-body{margin-top:6px}
.callout.danger .sym{color:var(--red)}
.callout.analogy .sym{color:var(--blue)}
.quiz-q .qtitle{margin-top:6px}
.quiz-score .big{line-height:1}

#termlines{flex:1;overflow-y:auto;min-height:0}

  <script>window.DATA = {"lessons": [{"id": "terrain", "navLabel": "Terrain generation", "hero": "One number and one shape rule in; the same floor-and-wall map out, every single time.", "intro": "Every level in this project has a map: a grid of floor tiles you can walk on and wall tiles you can't. Somebody builds that map, and that somebody is a small piece of code called the terrain generator. You'll learn that what looks like \"random terrain\" isn't really random — it's driven by a number called a seed, so the exact same map can be made again and again. By the end you'll be able to explain the four map shapes the generator can make, say what \"connected\" means and why every map guarantees it, and answer a reviewer who asks how one run could ever match another.", "concepts": [{"term": "Seed", "plain": "A number you give the generator; it decides which terrain comes out.", "deeper": "Same seed always yields the same map, even across two completely separate runs of the program."}, {"term": "Pseudorandom generator", "plain": "A machine that makes numbers that seem random but are actually strung together from the seed, so they're repeatable.", "deeper": "random.Random(seed) is built fresh inside the method on every call, so nothing random is remembered between calls."}, {"term": "Topology", "plain": "The shape rule for a level — the pattern the floor must follow.", "deeper": "Chosen from four presets; swapping it changes the whole feel of a level."}, {"term": "Connected", "plain": "All floor tiles link up, so you can walk from any one to any other without touching a wall.", "deeper": "Even the loosest topology guarantees this — there's never a floating island of floor."}, {"term": "Tree and branch", "plain": "A shape with no loops — every floor tile reaches the rest of the map in exactly one way, so there's a single path to follow.", "deeper": "A branch is a tile with three or more floor neighbors; branching trees must contain at least one."}, {"term": "Deterministic", "plain": "Same inputs always give the same output. No surprises.", "deeper": "That's what lets a level be replayed and scored fairly."}], "body": [{"heading": "The stage: a grid of floor and wall", "kind": "prose", "text": "The world is a rectangle divided into cells. Each cell is one of two things: floor, written as \".\", or wall, written as \"#\". Floor is where the player walks; wall stops them. A terrain is just the full set of rows, each row a string of dots and hashes. Generating terrain means deciding, for every cell, whether it becomes floor or wall."}, {"heading": "How a terrain is generated", "kind": "steps", "items": ["Read the spec: how many rows and columns, the allowed range of floor tiles, and the shape rule (topology).", "Make the random generator from the seed: rng = random.Random(seed). This is the only place the seed is used, and it is rebuilt on every call.", "Pick how many floor tiles to carve — the target — choosing within the allowed min/max range using that generator.", "Hand the shape rule the generator, the grid size, and the target. It chooses which cells become floor.", "Paint the grid: start with all walls, mark the chosen cells as floor, and return the finished rows."]}, {"heading": "The seed is a shuffled deck", "kind": "analogy", "text": "A seed works like agreeing on the exact order a deck is shuffled. In real life, ten people can't shuffle \"the same way\" — but here they can. Give the generator the seed 42, and it always deals the same terrain. Change it to 43, and you get a different but still repeatable map. The randomness is fake on purpose: it's a fixed recipe, and the seed is the one ingredient you may change."}, {"heading": "The four shapes (topologies)", "kind": "list", "items": ["STRAIGHT_PATH: a single corridor of floor running along one axis — horizontally if the board is wide enough, otherwise vertically. One line.", "BENT_PATH: an L-shape. A horizontal arm meets a vertical arm at a corner, and the total floor cells equal the target.", "BRANCHING_TREE: a shape with no loops, like a family tree drawn on the grid; it must contain at least one cell where three or more arms meet (a branch). It's built by adding cells that touch exactly one existing floor neighbor, so no loop can form.", "GENERAL: any connected shape. The only rule is everything links up."]}, {"heading": "Why determinism is the whole point", "kind": "callout", "text": "Because rng is built fresh from the seed inside the method, two brand-new generators with the same seed and spec cannot disagree. That's what makes a level fair to grade and safe to replay: you, or a referee, can recompute the exact same map later. If the generator had kept hidden random state on itself instead, a second run might quietly differ — a nasty class of bug the AI writer avoided by keeping state local."}, {"heading": "The #1 misconception", "kind": "misconception", "text": "\"It uses random, so nobody can reproduce the map.\" Wrong. The \"random\" is seeded, so it's fully repeatable. Randomness here doesn't mean unpredictable — it means varied-but-identical-for-the-same-seed. If a reviewer says this can't be tested because it's random, that's the exact misunderstanding to correct."}, {"heading": "Branching trees get retried", "kind": "callout", "text": "Branching trees rarely come out right on the first try. The generator grows a candidate tree once, checks whether it hit the target floor count and has a branch, and if not, throws it away and grows a fresh one — using the same seeded generator each time, so even the retries are reproducible. The number of tries is capped, so it can't loop forever."}, {"heading": "Reading the output", "kind": "prose", "text": "End to end, you get back a Terrain object whose rows are strings of '.' and '#'. That's the whole contract. Given the same seed and spec, those strings will be character-for-character identical every time. That's the guarantee you can point at when someone asks why a level can be rerun."}], "digest": "Give the generator a seed and a shape; it returns the same floor-and-wall map every time.", "check": ["Two separate TerrainGenerator objects are created with the same seed and spec. Will they produce the same terrain, and why?", "What is the difference between what STRAIGHT_PATH and BENT_PATH output?", "Why does a branching tree get rebuilt repeatedly until its conditions are met, and why is that still reproducible?", "What does \"connected\" guarantee for a map, and which topology is the loosest?"]}, {"id": "verification", "navLabel": "How we verified it", "hero": "We proved the engine works by running it 142 times, not by hoping.", "intro": "When you write code, someone will eventually ask: \"Does it actually work?\" Saying \"I think so\" isn't enough. This lesson shows how this project was verified the honest way: by running the real grading tool against real worlds and counting the results. By the end you'll know what a \"referee session\" is, what a \"certified engine world\" means, what a \"trace\" is, and why a passing test and a human-looking-at-the-screen are different things. You'll be able to explain the difference between \"the checks pass\" and \"I've seen it work with my own eyes\" — and why this project needs both.", "concepts": [{"term": "Referee session", "plain": "A referee session is the grading program run on a project to test it — the same checker the course workbench uses when it scores your solution. This project runs two of them: run_terrain_session (checks the map generator) and run_level_session (checks the whole level, including the explorer's route)."}, {"term": "Spec group", "plain": "A spec group is one distinct set of rules a level must follow — like 'the path is straight', 'there are enemies', or 'a patrol moves on a schedule'. The catalog defines 18 of them, across 9 tiers (0–8) of difficulty."}, {"term": "Certified engine world", "plain": "A certified engine world is a level that the official engine accepts as valid, built from the published catalog. 'Certified' means it meets the specification — not just any random map."}, {"term": "Trace", "plain": "A trace is the exact list of actions an explorer takes, in order — for example: ENGAGE the enemy, then move EAST, EAST, EAST, then SOUTH, SOUTH, then EXIT. Reproducing the canonical trace character-for-character means the explorer made every move the guide says it should."}, {"term": "Determinism", "plain": "Determinism means the same inputs always give the same output. A seeded generator is deterministic: feed it the same seed and you get the same map every time, which is what makes tests reproducible."}], "body": [{"heading": "The short answer", "kind": "prose", "text": "The project was verified two ways: automated referee grading and full engine runs. The referee sessions pass 18/18 spec groups. The full engine completed 142/142 certified worlds — including all 8 patrol worlds. Practice runs completed 8/8 straight-path worlds. The canonical enemy trace is reproduced exactly. Two honest caveats remain: the graphical GUI confirmation is still pending, and not every public seed was stress-tested."}, {"heading": "Step one: run the grader, not your own test", "kind": "steps", "items": ["Run the referee's own grading sessions — run_terrain_session and run_level_session, the exact functions the workbench uses.", "Point them at all 18 real spec groups from the catalog: families and guide levels across tiers 0–8.", "Watch what they check: determinism (same seed, same map), dependency wiring, topology, route, placement, ranges, and inventory."]}, {"heading": "Step two: run the real engine end-to-end", "kind": "steps", "items": ["Drive the actual run_public engine — the same path the workbench's Run solution uses.", "Generate worlds with the student's own code: TerrainGenerator → LevelGenerator → AgentController → engine.", "Run the Straight path family across horizontal/vertical, reversed, and seeds 11/29: 8/8 COMPLETED with score 100."]}, {"heading": "Step three: complete every certified world", "kind": "prose", "text": "After switching the controller from greedy to pathfinding, the controller completes every certified engine world: all 36 catalog family worlds (tiers 0–8, straight/bent/tree/general, with and without artifacts and enemies, seeds 11/29) plus all 106 published guide and workbench records (98 static + 8 patrol). That is 142/142 COMPLETED."}, {"heading": "The patrol and enemy fine print", "kind": "prose", "text": "On the exact published enemy level, the explorer reproduces the canonical trace character-for-character: ENGAGE enemy-0, then EAST, EAST, EAST, then SOUTH, SOUTH, then EXIT. This confirms it only clears the blocking enemy and leaves off-path enemies alone. Patrol worlds (guide + tier-8 family) complete without collisions or patrol engagement. On the enemy-choice level, it takes the cheaper outer route (cost 9) instead of the direct engage (cost 10)."}, {"heading": "The analogy", "kind": "analogy", "text": "Think of verification like inspecting a building before it opens. The referee sessions are the blueprint check: does the design meet every rule on paper? The full engine runs are the walkthrough: a person actually walks every hallway and opens every door. The canonical trace is the fire-drill checklist: the exact order of steps is written down and matched. A blueprint that passes and a building you've walked through are both needed — neither alone is enough."}, {"heading": "The #1 misconception", "kind": "misconception", "text": "The biggest wrong idea: 'If the validators pass, it definitely works.' That's not true. The validators pass on the provided terrain, but they never exercised the student's own generators live. The real end-to-end loop — student generates, student explores — was only confirmed later, by running the engine on student-generated worlds. Passing a check and seeing it work for real are different things. So is 'the tests passed' and 'I confirmed it in the GUI.' The GUI confirmation is still pending."}, {"heading": "Honest caveats", "kind": "callout", "text": "Two things are not yet fully verified. First, the graphical GUI confirmation is still pending: every saved run so far used provided terrain, so the student generators have never been exercised in the actual workbench GUI. Second, the full public seed range is wider than the seeds tested (11 and 29) — not every public seed was stress-tested. Both are flagged as TODO, not hidden."}], "digest": "18/18 referee groups pass, 142/142 engine worlds complete, canonical trace reproduced; GUI check still pending.", "check": ["What is the difference between the referee sessions and the full engine runs?", "Why is the canonical trace useful evidence that the explorer behaves correctly?", "The validators pass — why is that not enough to say the project is verified?", "What is still unconfirmed, and why does that matter for a final verdict?"]}, {"id": "entities", "navLabel": "The entities", "hero": "Three small objects hold the whole game world — and every one checks its inputs before it exists.", "intro": "This lesson covers the three building blocks that describe everything in the game: the player character, the artifacts you collect, and the enemies that punish you. Each one is a small Python class — a blueprint for making objects. By the end you will understand what an entity is, where its data comes from, and why creating one is more than just storing a few numbers. You will see why a negative score gets rejected instead of quietly fixed, and why every value is read-only once it exists. That pattern is the first line of defense in this AI-written codebase: garbage gets stopped at the door, never silently accepted.", "concepts": [{"term": "Entity", "plain": "An entity is any object in the game world that has a fixed identity — here, exactly three kinds: the character, artifacts, and enemies.", "deeper": "Each entity wraps a canonical definition from src.api, so the game never carries two slightly different copies of the same fact."}, {"term": "Canonical definition", "plain": "A canonical definition is a single, authoritative description of what valid data looks like, defined once in src.api and reused by the whole project.", "deeper": "Because all validation lives there, every place that creates a character, artifact, or enemy gets the same rules automatically — no one can bypass them."}, {"term": "Read-only property", "plain": "A read-only property is a value you can look at but never change after the object is created.", "deeper": "The @property decorator with no setter means nothing outside the class can reassign it — the data is frozen, which prevents accidental edits."}, {"term": "Fail-fast validation", "plain": "Fail-fast validation means rejecting bad input the moment it arrives, rather than fixing it or ignoring it.", "deeper": "A negative artifact value or empty ID raises an error immediately at creation, so a bug becomes loud and obvious instead of hiding until later."}], "body": [{"heading": "What an entity is", "kind": "prose", "text": "Think of the game world as a stage. The stage itself is the terrain. The things that live or move on it are the entities. In this project there are exactly three kinds: the character (you), artifacts (things worth points), and enemies (things that cost you points if you run into them). None of them are complex — together they are only three small classes — but how they are built matters more than what they contain."}, {"heading": "How one entity is built", "kind": "steps", "items": ["You call the class with its data, for example Artifact(\"relic\", position, 50).", "Before doing anything else, it builds the canonical ArtifactDefinition from src.api, handing over your inputs.", "That definition validates everything: the id must be a nonempty, already-trimmed string; the position must be a real Position (two integers); the value must be an integer that is zero or positive.", "If any check fails, the class raises an error right there — the object is never created, and nothing is stored.", "Only if everything passes does the object save the values and expose them as read-only properties: artifact_id, position, and value."]}, {"heading": "A toll booth on the way in", "kind": "analogy", "text": "Imagine a toll booth at the entrance to a game. You hand over your ticket and your money. The attendant checks both: the ticket must be real and nonempty, the money must be a genuine number and not negative. If you hand over a ticket that is blank, or money that is -5, you are turned away at the door — you do not get in with a quietly \"fixed\" ticket. That is exactly what these classes do. They are strict border guards, not helpful friends who smooth over your mistakes."}, {"heading": "The three entities at a glance", "kind": "list", "items": ["Character(agent_id) — holds only your player id, an identifier string. Exposes agent_id.", "Artifact(artifact_id, position, value) — holds an id, a spot on the grid, and a point value that must be zero or positive. Exposes artifact_id, position, value.", "Enemy(enemy_id, position, encounter_penalty) — holds an id, a spot, and a penalty that likewise must be zero or positive. Exposes enemy_id, position, encounter_penalty.", "Note: enemies have no health and no attack. They are not fighters here — they are just a cost you pay for stepping on the wrong tile."]}, {"heading": "Why 'canonical' matters", "kind": "prose", "text": "Each student class is deliberately thin. It does almost no thinking itself — it delegates to a shared definition in src.api. That is the point. If the game ever grows and needs a new rule (say, ids must be under twenty characters), you change it in one place, and every entity that uses it picks up the rule automatically. One source of truth beats three slightly different copies of the same idea. This is a classic defensive design: fewer places for rules to drift apart."}, {"heading": "Misconception: bad input should be fixed, not rejected", "kind": "misconception", "text": "A natural instinct is: if someone passes a negative artifact value, just clamp it to 0 and move on. This project deliberately does the opposite. Silently clamping hides the bug — the code keeps running, but with data that does not match what the caller meant. Rejecting it loudly makes the mistake visible the instant it happens, while the cause is still right in front of you. In a codebase you have to defend, loud and early beats quiet and wrong."}, {"heading": "The defensive takeaway", "kind": "callout", "text": "The entities are the whole world's data, and every one of them is immutable — read-only after creation — and validated at the front door. That combination means two things for you as a defender: bad data cannot sneak into the game, and once data is in, nothing can quietly change it later. If you are ever asked why the code feels rigid, this is the reason: rigidity here is a feature, not a bug."}], "digest": "Entities are Character, Artifact, Enemy — read-only objects that validate their own input at construction, so bad data fails loudly.", "check": ["When you create an Artifact with value -5, what happens, and why is that better than changing the value to 0?", "Why is every property read-only? What could go wrong if it could be changed after creation?", "What does \"canonical definition\" mean, and why does having one shared copy matter across the whole project?", "Do enemies have health or attack? What do they actually carry instead?"]}, {"id": "controller", "navLabel": "The controller", "hero": "The controller is the robot's brain: each turn it reads the world and picks exactly one move.", "intro": "Every turn of the game, the world changes around the agent, and someone has to decide what it does next. That someone is the controller: a block of code that runs once per turn, looks at the current state (where the agent is, what it has, where the enemies are), and returns exactly one action. By the end of this section you'll be able to explain the controller's decision order in your own words, say why standing on something is never enough on its own, and answer a reviewer who asks why the controller behaves the way it does.", "concepts": [{"term": "Action", "plain": "One thing the agent can do on its turn: move north, south, west, or east, collect an artifact, engage an enemy, wait, or exit.", "deeper": "The controller MUST return exactly one action every turn, even if the right choice is to do nothing (that's the WAIT action)."}, {"term": "Turn", "plain": "A single step of the game, where the controller reads the world and answers with one action.", "deeper": "Every accepted action advances the patrol clock by one turn, so the world shifts even when the agent stands still."}, {"term": "Patrol", "plain": "An enemy that walks a fixed loop on a schedule, so its next position is predictable.", "deeper": "The planner never fights patrols; it times around them."}, {"term": "Artifact", "plain": "An item sitting on a tile that the agent must stand on and actively collect.", "deeper": "Just standing on an artifact does nothing, you must return the COLLECT action."}, {"term": "Plan", "plain": "A precomputed list of steps from the agent's current spot to the exit, chosen as the lowest-cost path.", "deeper": "The plan is recomputed each turn, and only its first step is used."}, {"term": "Exit tile", "plain": "The goal square. Reaching it wins the level only if the controller also returns the EXIT action.", "deeper": "Arrival is not the same as leaving."}], "body": [{"heading": "What the controller is", "kind": "prose", "text": "The controller is the decision-maker. It does not move the agent itself; it only chooses. Each call to choose_action(state, agent_id) reads the current world and returns one action. The game then applies that action and advances to the next turn. Nothing else decides for the agent, this one function is the whole brain."}, {"heading": "The decision order", "kind": "steps", "items": ["If the agent is standing on the exit tile, return EXIT.", "Else, if an uncollected artifact is on the agent's own tile and no patrol will arrive there next turn, return COLLECT.", "Else, follow the plan: return the first step of the lowest-cost path toward the exit.", "If there is no usable plan, return WAIT."]}, {"heading": "One decision at a time", "kind": "analogy", "text": "Think of the controller as a taxi driver at an intersection. The driver doesn't decide the whole ride upfront every second; they look at what's ahead right now and make one call, turn left, wait, merge. When the light changes, they re-look. The controller works the same way: every turn it looks fresh and picks the single best next move, so it can react to patrols moving and meters getting collected."}, {"heading": "Arriving is not leaving", "kind": "callout", "text": "This is the sharpest edge in the whole file. Walking onto the exit tile does not end the level. The code checks, if position == state.level.exit, return EXIT. Reaching the tile is only half; the controller must actively return the EXIT action to win. The same idea applies to artifacts: standing on one never collects it, the controller has to choose COLLECT."}, {"heading": "The biggest wrong idea", "kind": "misconception", "text": "Many people assume that stepping onto an exit or an artifact automatically triggers it, like a checkpoint in a platformer. It does not. In this project, moving onto a tile and acting on it are separate decisions, and the controller must explicitly commit the EXIT or COLLECT action. If you review the code and see the agent standing on the exit but the loop not ending, that is almost always the controller returning the wrong action instead of EXIT."}, {"heading": "Why the checks are ordered", "kind": "prose", "text": "Order matters. The exit check runs first, so the agent always leaves the moment it can. The collect check runs second and is guarded: it only collects if no patrol is about to arrive on that tile, because collecting costs one turn and a patrol landing on you is a collision. Only after those quick checks does the controller fall back to the slow pathfinding plan, and if even that has no route, it waits rather than guess."}], "digest": "Each turn the controller returns exactly one action: leave if on the exit, collect if safe, else follow the plan, else wait.", "check": ["Why must the controller return EXIT only when standing on the exit tile, and never earlier?", "What condition must be true before the controller collects an artifact, and why?", "If there is no plan, the controller returns WAIT. Why is waiting better than guessing a move?", "How many actions does choose_action return per turn, and why does that constraint matter?"]}, {"id": "overview", "navLabel": "What you built", "hero": "Six modules, one pipeline, zero designers: your code builds the world it plays.", "intro": "Adventure Workbench is a game world — a grid you walk your character through. But nothing in it was hand-made. Your job was to write the code that builds the world and then decides how to move through it. You won't touch any art or engine. All six student modules live in src/student/, and each has one job. The interesting part is how it gets checked: not by a human watching you play, but by an automated referee that runs your code against a fixed specification. By the end of this, you'll be able to explain what each module does, how the pieces connect in a pipeline, and why \"same seed, same world\" is the backbone the whole thing relies on.", "concepts": [{"term": "Module", "plain": "A single file of code with one clear job. This project has six student modules in src/student/: character.py, artifact.py, enemy.py, terrain_generator.py, level_generator.py, and controller.py.", "deeper": "Each keeps the exact function signatures the workbench expects — change them and the referee can't talk to your code."}, {"term": "Pipeline", "plain": "The fixed order work flows through: a spec plus a seed go in, the terrain generator builds the map, the level generator places entities, the controller plays the world, and the referee grades the result.", "deeper": "Because the order is fixed, each stage knows exactly what shape its input will take."}, {"term": "Seed and determinism", "plain": "A seed is a starting number. The same seed always produces the same world — like how the same recipe gives the same cake every time.", "deeper": "This is the backbone: because worlds are reproducible, the referee can replay them and compare your behavior against an expected result."}, {"term": "Snapshot", "plain": "An immutable picture of the world at one moment — where your agent is, where enemies and patrols are, what you've collected. You can look at it but never change it.", "deeper": "Every turn the controller receives a fresh snapshot and must return one action based only on it."}, {"term": "Action", "plain": "One choice your controller makes per turn: MOVE, COLLECT, ENGAGE, WAIT, or EXIT.", "deeper": "The engine accepts or rejects it, advances the clock, and hands back the next snapshot."}, {"term": "Referee (validator)", "plain": "An automated grader. It runs your modules against a spec's private test worlds and reports pass/fail — no human watches your screen.", "deeper": "It also drives the real engine (run_public) to replay whole worlds and confirm your character actually reaches the exit."}], "body": [{"heading": "What you actually built", "kind": "prose", "text": "Adventure Workbench is a game you never see. There's no art, no story, no hand-made dungeon. Instead, there's a world made purely of data — a grid of tiles, your agent's position, enemies, patrols, artifacts, and an exit. You wrote the code that generates that world and then decides how to move through it. If it all works, the whole thing runs end-to-end with no human touching it."}, {"heading": "How the pipeline runs", "kind": "steps", "items": ["A spec (the rules for this scenario) and a seed (a starting number) go in.", "terrain_generator.py carves traversable terrain from that seed.", "level_generator.py places the exit, artifacts, enemies, and patrols in legal spots.", "Together those two form the World — one reproducible stage.", "The controller (controller.py) reads a snapshot every turn and returns one action.", "The referee runs validators, then replays the world with the real engine to grade it."]}, {"heading": "Think of it like an assembly line", "kind": "analogy", "text": "The pipeline is a factory assembly line. The terrain generator hands a part to the level generator, which snaps the finished world onto the belt. Then the controller is the worker at the end who reads the label on each item and does exactly one thing to it before it moves on. If any worker stops or does the wrong step, the whole line stalls."}, {"heading": "Why determinism is the backbone", "kind": "callout", "text": "If a seed produced a different world each run, grading would break: the referee couldn't replay the same test twice, and a lucky or unlucky layout would decide your score. Because the same seed always yields the same world, every run is a fair, repeatable test. That is also why the generators must never lean on randomness that ignores the seed."}, {"heading": "What your modules actually do", "kind": "prose", "text": "character.py is deliberately minimal — it builds your agent's identity and fails fast if the id is invalid. The heavy lifting is in controller.py. It doesn't wander: it plans a lowest-cost path to the exit using Dijkstra's algorithm, a standard search method, tracking position, turn, and which enemies are defeated. It predicts where patrols will be before moving, so it never collides with one. It collects artifacts on the tile it stands on, engages static enemies that block the route, and exits the moment it reaches the exit tile."}, {"heading": "Real numbers from the project", "kind": "prose", "text": "The verification log records what actually passed: all 18 distinct spec groups pass both referee sessions. The controller completes all 142 certified engine worlds across every topology and mode — including all 8 patrol worlds. And a full live run of the real engine completes 8 of 8 straight-path worlds with a perfect score of 100."}, {"heading": "The #1 wrong idea", "kind": "misconception", "text": "It's easy to picture a robot watching a little character shuffle around a screen and nodding. That's not how this works. The referee is a program, not a spectator. It runs your modules against hidden test worlds, checks their outputs against the spec, and replays full worlds through the real engine to confirm your agent actually reaches the exit. No human watches your screen — the grading is completely programmatic."}, {"heading": "The real point: defending code", "kind": "callout", "text": "This whole project is practice for a harder skill: standing behind code you didn't fully write yourself. AI drafted much of this. Your job isn't just to make it run — it's to understand each module well enough to explain it, defend its choices, and spot where it could go wrong. That's why each module is small and each idea maps to one clear concept: procedural generation, pathfinding, decision loops, and testing against a spec."}], "digest": "You built data-driven modules that generate a random-looking but deterministic world, navigate it, and pass an automated referee.", "check": ["If you run the same seed twice, why must you get the very same world, and what would break if you didn't?", "Walk the pipeline: what does each of the six student modules feed into the next?", "What is the difference between a snapshot and an action, and why must the snapshot be immutable?", "How does the controller avoid running into a patrol, and why does it never try to fight one?"]}, {"id": "defend", "navLabel": "Defend your project", "hero": "When the reviewer asks \"why\", you need answers that come from your code, not guesses.", "intro": "A reviewer will probe your project. They will not ask \"does it work\" and stop. They will ask why you built it the way you did, and what happens in the tricky cases. This section gives you honest, accurate answers to the questions you are most likely to get. By the end, you will be able to explain what your controller actually does, why it plans a route instead of walking straight at the exit, and where you would go next. Every answer below is grounded in the real code in controller.py and the verified progress log, so you can defend it without bluffing.", "concepts": [{"term": "static enemy", "plain": "An enemy that never moves. In your code, it is a clearable blocker: you ENGAGE it to clear the way, paying one action plus its encounter penalty, and then you walk through its cell.", "deeper": "In controller.py, a static enemy is any enemy that does not own a patrol. Defeated ones are ignored."}, {"term": "patrol", "plain": "An enemy that moves on a fixed, repeating schedule. It advances one step per accepted action, so its future position is predictable.", "deeper": "You never engage a patrol. You predict where it will be next and time your movement to avoid it."}, {"term": "Dijkstra (pathfinding)", "plain": "A search that explores every possible sequence of moves and keeps the cheapest one to the exit, treating each action and enemy encounter as a cost.", "deeper": "Your controller searches over (position, turn, defeated) states, so it plans against future patrol positions, not just the current snapshot."}, {"term": "determinism", "plain": "The property that the same input always produces the same output. Your terrain generator is seeded, so a given seed always makes the same map.", "deeper": "Because it is deterministic, your results are reproducible, and you can match a canonical trace exactly."}, {"term": "deadline / max_turns", "plain": "The cap on how many actions you may take. If the turn counter reaches it before the exit, the run fails.", "deeper": "The planner stops exploring once reaching the limit would overshoot, so it only plans routes that fit."}], "body": [{"heading": "Why not just move toward the exit?", "kind": "prose", "text": "Walking straight at the exit sounds simple, but it fails in this world. The older greedy version of your controller did exactly that, and it could get stuck: on any map where the first step away from your starting cell is not toward the exit, it would just WAIT forever. The map can have walls, enemies blocking the path, and patrols moving into your way. So you replaced guessing with planning. The controller searches the whole reachable space, finds the lowest-cost route to the exit, and takes the first step of that route. This is why it completes 142 of 142 certified worlds instead of locking up."}, {"heading": "What bug did you fix?", "kind": "list", "items": ["The controller used to send MOVE_NORTH when it meant to move south, so it walked the wrong way on vertical and reversed paths. It is now coordinate-aware and uses (row, column) offsets.", "The greedy walker could WAIT-lock on maps where the first correct move was away from the exit. Switching to planned pathfinding fixed that.", "artifact.py used to clamp negative artifact values to 0, hiding bad data. It now rejects negative values outright. Same for enemy penalties, which used to be accepted as negative."]}, {"heading": "Static enemies vs patrols, and do you kill either?", "kind": "analogy", "text": "Think of static enemies as doors and patrols as moving guards. You do not kill either one. A static enemy is a door you pay to open: you ENGAGE it, which costs one action plus its encounter penalty, and then the cell is clear to walk through. A patrol is a guard you never fight. You read its fixed schedule, predict where it will be after your next action, and time your move (or WAIT) so you never share a cell with it. Your code never engages a patrol, and it only engages a static enemy when that enemy actually blocks your route, leaving off-path enemies alone."}, {"heading": "How do you know every level is solvable?", "kind": "prose", "text": "Short answer: you don't assume it, you search it. The controller treats the whole task as a complete search over every reachable (position, turn, defeated) state. If a valid route to the exit exists, this search finds it; if no route exists, the planner returns None and the controller spends the run safely. That is how the controller could be verified: it completed all 36 catalog family worlds and all 106 published guide and workbench records, 142 of 142, and it reproduces the canonical published enemy-level trace character for character."}, {"heading": "Why does determinism matter?", "kind": "callout", "text": "Determinism means the same seed always produces the same map and the same run. That matters for two reasons. First, when you are debugging, a failure can be reproduced and fixed instead of being a random one-off. Second, it is what lets you verify a result exactly, like reproducing the canonical eight-step trace. Your terrain generator is seeded with random.Random(seed), so fresh instances are deterministic. One honest caveat from the log: the full public seed range is wider than the seeds you tested, so a final live confirmation in the actual workbench GUI is still the last step."}, {"heading": "Why not collect every artifact?", "kind": "analogy", "text": "Collecting an artifact costs an action, and every action advances the patrol clock one step. Think of time as a limited resource and patrols as hazards that move with it. If you took a long detour to grab every artifact, you would spend turns that the patrols use to move into your path, and you could run out of turns before reaching the exit. So the controller collects only artifacts that sit on the tile it is already passing through, and only when no patrol is about to arrive on that cell after the collection. It harvests opportunistically, never detours."}, {"heading": "What did you intend to learn, and what would you improve next?", "kind": "steps", "items": ["The core lesson was planning under constraints: a greedy policy fails, but a complete lowest-cost search over states succeeds reliably.", "The second lesson was reading a moving system: predicting patrol phases from the turn clock turns a dangerous patrol into a solvable timing problem.", "Next, exercise more of the public seed range and run the final confirmation in the actual workbench GUI, since every saved run so far used provided terrain.", "After that, consider handling edge cases the search does not weigh, such as optimizing artifact value against travel cost, instead of only collecting whatever is on the way."]}, {"heading": "The #1 misconception", "kind": "misconception", "text": "The biggest wrong idea is that \"winning\" means destroying or defeating every enemy. It doesn't. There is no combat or kill mechanic in this project at all. You pay a penalty to clear a blocking static enemy, and you never touch a patrol; the whole game is about reaching the exit within the turn limit at the lowest cost. If you claim you 'kill enemies', a reviewer who read the code will catch it. Say exactly what you do: ENGAGE blockers, time patrols, and exit."}], "digest": "Plan a route, clear only blocking static enemies, time patrols, and exit cheaply within the turn limit.", "check": ["Why does the controller search a full plan instead of just moving toward the exit?", "What is the difference between a static enemy and a patrol, and what do you do to each?", "How does the controller know whether a level is solvable?", "Why is determinism useful, and what is the one thing still left to confirm live?"]}, {"id": "level", "navLabel": "Level generation", "hero": "Your map doesn't draw itself — and knowing who draws it is half the defense.", "intro": "A video game level is a little world: some walkable floor, a place you start, a place you leave, and things you grab or avoid. Building that by hand is fine for one map, but this project creates many levels from a small description. That job belongs to a piece of code called LevelGenerator. By the end of this section you can explain how it works: how it gets the terrain, how it chooses where you start and exit, and how it decides where artifacts and enemies sit. You will also see the invisible rules that keep every generated level fair and legal.", "concepts": [{"term": "Contract (TerrainGeneratorContract)", "plain": "A promise between two pieces of code: anything that supplies me terrain must answer these calls, and LevelGenerator expects exactly that without caring who the builder is.", "deeper": "Because LevelGenerator never makes terrain itself, swapping one builder for another changes the map style without touching the rest of the code."}, {"term": "Degree-one cell", "plain": "An open, walkable tile that touches only one other open tile — in other words, a dead end or the tip of a corridor.", "deeper": "For straight and bent corridors, a path has exactly two such tips, so those become the start and exit."}, {"term": "Manhattan distance", "plain": "The number of steps from one tile to another if you can only move up, down, left, or right — no diagonal shortcuts.", "deeper": "It is the route length on a grid, and the code uses it so start and exit are neither too close nor too far apart."}, {"term": "Seeded random number generator", "plain": "A random number machine you can rewind: give it the same seed (a starting number) and it produces the exact same sequence of random choices every time.", "deeper": "That is why the same seed always rebuilds the identical level — the key to reproducing and testing a bug."}, {"term": "Traversable tile", "plain": "A floor tile you can stand on, as opposed to a wall tile you cannot.", "deeper": "Entities are never placed on walls, because they could not be reached."}, {"term": "Endpoints", "plain": "The start and exit tiles of a level.", "deeper": "Different map shapes pick these differently, which is the part worth watching."}], "body": [{"heading": "What level generation really is", "kind": "prose", "text": "Building a level is assembly, not invention. LevelGenerator takes a specification (a written description of what the level should contain) and a seed, then runs three phases: get the terrain, choose start and exit, and sprinkle in the artifacts and enemies. Each phase follows fixed rules, and those rules are the whole point of this reading: a reviewer will ask you why a level looks the way it does, and the answer lives in these rules."}, {"heading": "The terrain is borrowed, not built", "kind": "prose", "text": "First, the terrain. LevelGenerator does not draw the map. It is given a terrain generator at startup through a thing called a contract — a promise that whatever generator is handed over can produce terrain, This is called dependency injection: the code that needs a service receives it from outside instead of building it itself. So the layout comes from somewhere else, and LevelGenerator just asks for it."}, {"heading": "The pipeline, step by step", "kind": "steps", "items": ["Trust the terrain: call the injected generator to build the map, returning walkable ('open') and blocked tiles.", "Collect open tiles: scan every tile and keep the ones you can stand on.", "Pick endpoints: choose start and exit using the shape of the terrain.", "Place entities: drop artifacts and enemies onto open tiles under the fairness rules.", "Ship the level: bundle seed, terrain, start, exit, artifacts, and enemies into a finished LevelDefinition."]}, {"heading": "How start and exit get chosen", "kind": "prose", "text": "How endpoints get picked depends on the map's shape. For straight or bent corridors, a path has exactly two dead ends — tiles with only one neighbor, called degree-one cells. Those become start and exit. For trees and general open maps, the start is simply the top-left open tile, and the exit is the first other tile whose Manhattan distance (step count) falls inside the requested minimum and maximum route moves. If nothing qualifies, it falls back to the last open tile. Every case bounds the route length, which keeps the level playable instead of absurdly short or long."}, {"heading": "The restaurant analogy", "kind": "analogy", "text": "Think of a restaurant that cannot cook. It does not grow its own food; it orders from a supplier who promises delivery. The supplier may change, but the restaurant's orders stay the same. LevelGenerator is the restaurant. The terrain generator is the supplier. The contract is the delivery promise — as long as the supplier honors it, LevelGenerator never needs to know how the food (or the map) was made."}, {"heading": "The #1 wrong idea", "kind": "misconception", "text": "The biggest misconception: 'The level generator designs the whole map itself.' It does not. It borrows the terrain from an injected builder. Its own work is picking endpoints and placing entities. Confusing those two jobs leads you to look for layout logic in the wrong file — and to miss the boundary where bugs and exploits tend to hide."}, {"heading": "Where entities may go", "kind": "list", "items": ["Entities only go on open, walkable tiles — never on walls.", "Enemies are never placed on the start tile; that would be unfair.", "Unless allowed, both artifacts and enemies also avoid the exit tile.", "Unless overlapping is allowed, no two entities share a tile.", "Each entity gets a unique id — ART-1, ENM-2 — so the game can tell them apart.", "Artifact values and enemy penalties are rolled from the specification's range using the seeded random numbers, so they vary but stay within bounds."]}, {"heading": "Why these rules matter", "kind": "callout", "text": "These rules are guards, not decoration. They guarantee a level is always beatable and fair no matter what the random numbers say. When you defend an AI-written project, this is the exact spot to check: did the writer put limits on randomness? Can an enemy land on the start, or an artifact on the wall? These invariants are the backbone of a trustworthy generator."}], "digest": "Level generation delegates terrain to an injected builder, then picks endpoints and places entities under strict fairness rules.", "check": ["Who actually builds the terrain, and how does LevelGenerator get hold of that builder?", "For a straight corridor, how does the code decide which tiles become the start and exit?", "The code forbids enemies on the start tile. Where does that rule live, and how is it enforced?", "If you generate the same challenge with the same seed twice, will you get the same level? Explain why."]}, {"id": "planning", "navLabel": "How the controller plans", "hero": "It doesn't guess. It maps every route, prices them, and walks the cheapest one.", "intro": "A controller that just \"heads toward the exit\" is a dead end. In one map I looked at, the first step away from the exit is a wall, so that controller has no legal move - and when it's allowed to do nothing, it just waits forever. That's a bug you want to catch. The real planner thinks ahead. It searches over every reachable state, prices each route by how many actions it costs, and picks the cheapest one. By the end of this section you'll be able to explain that search, why the turn number is part of each state, and why a longer detour can beat a straight path.", "concepts": [{"term": "State", "plain": "A snapshot of where you are: your position on the grid, the current turn, and which enemies are already defeated. Two states are different if any of those three things differ.", "deeper": "This is the trickiest part: the same tile at turn 5 and turn 12 is a different state, because the floor plans move with the clock."}, {"term": "Cost", "plain": "How expensive a route is in actions. A normal move or WAIT costs 1; engaging an enemy costs 1 plus its encounter penalty.", "deeper": "The planner compares these numbers, not the number of tiles. A detour of 6 actions beats a straight path through an enemy that costs 13."}, {"term": "Dijkstra's algorithm", "plain": "A way to explore routes in order of cost, cheapest first. Because it always explores the cheapest known route next, the first time it reaches a state, that route is the cheapest way to get there.", "deeper": "It uses a priority queue (a heap) so it can grab the cheapest not-yet-explored route each loop. As soon as it reaches the exit, it stops and walks the path backward."}, {"term": "Patrol clock", "plain": "Patrols move once per accepted action, so their future position depends on how many turns have passed. Planning against their future spots - not just where they are now - is why the turn is in the state."}, {"term": "Encounter penalty", "plain": "An extra cost charged for fighting a static enemy, set per enemy in the level. It's what makes the planner weigh fighting vs. going around.", "deeper": "Patrols can't be fought at all - they're only timed around. Only static, undefeated enemies are clearable blockers."}, {"term": "The WAIT-lock bug", "plain": "What happens to a naive controller with no legal move: since waiting is allowed, it just waits forever instead of recovering. The planner avoids this by always having a whole route computed before moving.", "deeper": "If the planner can't reach the exit at all, it returns no plan and the controller falls back to waiting - but that's a last resort, not its normal behavior."}], "body": [{"heading": "Where a dumb controller dies", "kind": "prose", "text": "Start with the version you'd write in five minutes: always move one step toward the exit. It works until the step right next to the exit is a wall. Now it has no legal move - and since WAIT is allowed, it just stands there forever. That's the WAIT-lock bug. It's not a clever failure; it's a controller that never looked more than one step ahead."}, {"heading": "The planner thinks in routes, not steps", "kind": "analogy", "text": "Picture the map as a road network. Each tile is an intersection, each corridor is a road, and every road has a toll. Moving costs 1, and walking into a battle is an expensive toll booth. Pit plans the whole trip ahead of time: load all the routes it can reach, add up the tolls, and commit to the cheapest one. A detour that costs 6 beats a 'straight' road that runs through a 13-toll battle, every time."}, {"heading": "How the search works", "kind": "steps", "items": ["Start with one state: your current position, your current turn, and the set of enemies already defeated.", "Repeatedly pop the cheapest not-yet-explored state off a priority queue (a heap).", "From it, consider every move: north/south/east/west (cost 1), ENGAGE an adjacent static enemy (cost 1 plus that enemy's penalty), or WAIT (cost 1).", "Each move produces a new state - position changed, turn bumped by one, enemies defeated grown - and you record the cheapest cost found to reach it.", "Because you always explore cheapest first, the first time you reach the exit tile, the route you found is the cheapest one. Stop there.", "Walk the recorded 'previous' pointers backward from the exit to the start, then reverse them to get the ordered list of actions."]}, {"heading": "Why the turn is part of a state", "kind": "callout", "text": "Patrols move with the clock: their position is computed from the schedule, the turn, and their start phase. The same tile at a different turn is a different state, so the planner must consider where patrols will be in the future, not just now. A route is only legal if the next tile is clear now and stays clear right after the move advances the clock - the code checks both the current and the next-turn patrol positions."}, {"heading": "Fighting is priced, not free", "kind": "callout", "text": "Engaging a static enemy costs one action plus its encounter penalty. That penalty is the whole point: it makes the planner decide between clearing a blocker or going around it. Patrols are never engaged - only timed around. So the route you get reflects a real trade-off, not a fixed path."}, {"heading": "Misconception: shortest means fewest tiles", "kind": "misconception", "text": "The common wrong idea is that the planner minimizes the number of tiles traveled. It doesn't. It minimizes total cost: actions plus encounter penalties. That's why a detour of 6 actions is chosen over a path through an enemy that costs 13. If you read this code and think it's 'just pathfinding,' you'll miss the whole reason the cost function exists."}, {"heading": "When the exit is unreachable", "kind": "prose", "text": "If no route to the exit exists, the search ends with no goal and returns no plan. The controller then falls back to WAIT - which is where the WAIT-lock bug lives, but now as a deliberate last resort rather than an accident. It's the difference between a controller that has no option and one that has no plan."}], "digest": "The planner prices every route by actions plus penalties, searches cheapest-first, and walks the cheapest path - not just the shortest.", "check": ["Why does a greedy 'move toward the exit' controller lock up, and what action does it fall back on?", "What three things make up a state in this search, and why is the turn one of them?", "Why might the planner choose a 6-action detour over a straight path through an enemy?", "What happens when the planner finds no route to the exit - and how is that different from the WAIT-lock bug?"]}, {"id": "determinism", "navLabel": "Why seeds matter", "hero": "Same seed, same map — every time, on every machine, for every player. That's determinism.", "intro": "Every map here comes from just two inputs: a specification (the rules — how big, how many open tiles, what shape) and a seed (one integer). This section is about why that seed matters so much. By the end you'll be able to explain why the same seed must produce the identical map on every fresh run, how the referee verifie
