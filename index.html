s it, and why the tempting shortcut of remembering the last map quietly breaks the whole system.", "concepts": [{"term": "Seed", "plain": "A seed is a single number (never negative) that acts as the starting point for every 'random' choice in the generator. Same seed plus same rules equals the same map.", "deeper": "In the code, random.Random(seed) builds a private random-number machine from it, and every coin flip the generator makes pulls from that one machine in a fixed order."}, {"term": "Determinism", "plain": "Determinism means identical input always produces identical output — here, the same spec and seed must produce the exact same grid of tiles.", "deeper": "It must hold across fresh instances, not just within one object: a brand-new generator with the same spec and seed must draw the same map."}, {"term": "Canonical record", "plain": "A canonical record is a frozen, standardized snapshot of a request or its output, written in one exact format so it can be compared byte for byte.", "deeper": "The referee encodes a map's geometry as canonical bytes and fingerprints them with a SHA-256 digest, so 'did these two runs match?' becomes a simple byte comparison."}, {"term": "Referee", "plain": "The referee is the automated judge that runs your generator, checks its output against the rules, and decides pass or fail.", "deeper": "To test determinism it runs an A/A/B/A sequence on one object, then repeats request A on a separate fresh instance and insists every copy matches."}], "body": [{"heading": "A map from a thousand coin flips", "kind": "prose", "text": "This project builds a map — a grid of open floor tiles ('.') and walls ('#'). There is no artist drawing it. Instead the generator makes a long string of choices: which row to start on, how long a hallway should be, where to branch. Left alone, those choices would be different every run. That is the problem a seed solves."}, {"heading": "How a seed pins it down", "kind": "prose", "text": "Look at the very first step of the generator's work: rng = random.Random(seed) (src/student/terrain_generator.py, line 86). That creates a private random-number generator seeded from your integer. Every random call the generator makes — picking a row, a column, a corridor length, a branch point — pulls from this one rng, in a fixed order. Same seed means the same sequence of numbers in the same order, so the map is fully decided by the spec plus the seed, and nothing else. If you didn't create this local RNG and instead fell back on the program-wide random module, the seed would do nothing and every run would drift."}, {"heading": "What the referee actually demands", "kind": "steps", "items": ["It freezes your request — that spec and seed become a canonical record — before anything runs. From here, ground truth is bytes, not vibes.", "It builds one generator object and asks for request A, then A again, then a different request B, then A a third time. All three A answers must be byte-identical.", "It builds a second, brand-new generator and asks for request A once more. That answer must match too. This is the fresh-instance test.", "If the fresh instance disagrees, it flags NONDETERMINISM with code CONTENT_MISMATCH. If the factory hands back the same object instead of a new one, it flags SHARED_INSTANCE. Both are failures."]}, {"heading": "Why a seed is like a world seed", "kind": "analogy", "text": "You've probably seen this before: in games like Minecraft, a world seed is a short string, and that seed generates the same landscape for every player, every time. This is the same idea. The spec is the shape of the canvas; the seed is which of the infinite possible maps gets painted on it. Anyone with the same spec and the same seed must see the identical map — including a brand-new copy of the generator. That shared, repeatable map is what lets the referee check your work fairly."}, {"heading": "Even the retries are on the seed's stream", "kind": "callout", "text": "An easy place to break determinism is the retry loop. For the branching-tree topology, the generator tries to grow a tree up to max(max_attempts * 4, 8) times. Each failed attempt calls _grow_tree again — but every attempt draws from the SAME seeded rng, so it consumes the next numbers in the same fixed stream. The retries are part of the deterministic sequence. Any code that 'tries again' must keep pulling from the seeded RNG, never from fresh global randomness, or the replay diverges."}, {"heading": "Myth: remembering the last map is a harmless shortcut", "kind": "misconception", "text": "The classic trap: cache the last generated map on the instance and return it when the same spec and seed come in again. It looks like a speedup and it passes the within-one-object check. It fails the moment the referee builds a SECOND instance: a fresh object has no cache, so it regenerates from scratch — and whether that regenerate matches depends on randomness the seed didn't control. Determinism isn't 'this object remembers'; it's 'any fresh object, given the same spec and seed, independently arrives at the same map.' The fix is almost backwards: don't store results on the instance at all. Recreate the local random.Random(seed) and recompute every time."}, {"heading": "Why you should care beyond the grade", "kind": "prose", "text": "Determinism isn't teaching-assistant trivia. Because the map is a pure function of spec and seed, a bug is reproducible: hand a teammate the exact spec and seed and they watch the same broken map appear. And when the referee re-runs your submission against a canonical record, it can prove the output is genuine and repeatable — that's the difference between 'a map was made' and 'this specific map, made from this specific seed.'"}], "digest": "A seed pins down every \"random\" choice, so the same spec plus seed yields the same map on every fresh run.", "check": ["In your own words, what does it mean for terrain generation to be deterministic, and why must it hold across fresh instances rather than just within one object?", "Where in the student generator is the seed turned into actual randomness, and why does creating the RNG inside the method — rather than once at the class level — matter?", "The referee runs A/A/B/A. What is each phase checking, and what would make it flag NONDETERMINISM?", "Why does caching 'the last map' on the instance break determinism, even though it looks like a clever speedup?"]}, {"id": "enemies", "navLabel": "Enemies &amp; patrols", "hero": "You can't fight a patrol. You read its route, time your move, and thread through.", "intro": "This world has two kinds of enemy, and they punish you differently. A static enemy sits on one cell and never moves. You clear it by paying a toll. A patrol walks a fixed route in a loop, forever. You can't fight it, you can only predict where it'll be and slip past. By the end of this lesson you'll know exactly how patrols move, what ENGAGE actually does, and the one rule that decides whether you survive a crossing.", "concepts": [{"term": "Static enemy", "plain": "A blocker that stands on one cell and never moves. You clear it with ENGAGE while standing on a neighboring cell."}], "body": [{"heading": "Two kinds of enemy", "kind": "prose", "text": "The grid holds two kinds of enemy. A static enemy stands still. A patrol moves."}], "digest": "Two blockers: static enemies you pay to remove, patrols you can only time.", "check": ["Why must you check where a patrol will be after your move?"]}, {"id": "world", "navLabel": "The world model", "hero": "Your world is just a grid of floor and wall cells. Read it right and nothing sneaks past you.", "intro": "The world is the stage every other rule stands on. Before you can judge how an AI-written character moves, collects, or fights, you have to understand the ground under its feet. In this project the world is not a physics engine — it is data: a rectangle cut into small squares, each holding one of two symbols. By the end you can read any world from its raw text, tell a walkable cell from a wall, translate a position into a row and column, and know what a snapshot of the world contains. That is the foundation for defending everything else.", "concepts": [{"term": "Cell", "plain": "One square of the grid, holding a single character. It is either floor ('.') or wall ('#').", "deeper": "Cells are the smallest unit; an agent moves between neighboring cells one step at a time, north, south, west, or east."}, {"term": "Terrain", "plain": "The whole layout of the world: a rectangular list of text rows, each row a string of '.' and '#' characters.", "deeper": "Terrain is stored as a tuple of strings, so the world is literally text you can open and verify."}, {"term": "Position", "plain": "One specific cell's address, written as Position(row, column). Row 0 is the top row, column 0 is the left column.", "deeper": "Order matters: row comes first. Confusing it with (x, y) flips your entire map."}, {"term": "Traversable", "plain": "The single question the terrain answers: can a character stand on this cell? Only floor cells are traversable, and only when the position is inside the grid.", "deeper": "A wall is not a physical obstacle — it is simply a cell where is_traversable returns False."}, {"term": "WorldSnapshot", "plain": "A frozen copy of the world at one moment in the game: the terrain, where the agent is, the current turn, what's been collected, and which actions are allowed.", "deeper": "It is immutable — you can read it but not change it. Each turn hands you a fresh snapshot."}, {"term": "Start and exit", "plain": "Two distinct marked cells: where the agent begins, and where it must arrive to finish.", "deeper": "They must be different cells, and the floor between them must stay connected or the level cannot be won."}], "body": [{"heading": "What the world is", "kind": "prose", "text": "The world is a rectangle cut into small squares called cells. Each cell holds exactly one character of text. A '.' means floor — you can stand there. A '#' means wall — you cannot. In the code, the whole world is just a list of text rows, one string per row. Here is a tiny world, 2 rows tall and 3 columns wide:\n\n.##\n...\n\nRow 0 is '.##': a floor, then two walls. Row 1 is '...': three floor cells. That is the entire world. Nothing hidden behind it."}, {"heading": "Think of a city map", "kind": "analogy", "text": "Picture a street map drawn on graph paper. Each square is one city block. A floor cell is an open plaza — you can stand on it. A wall cell is a building — you cannot walk through it. The whole map is just labeled squares; the buildings don't have physics. They are simply squares you are not allowed to stand in."}, {"heading": "How to read a position", "kind": "steps", "items": ["A position is written Position(row, column).", "row is how many rows down from the top — row 0 is the very top.", "column is how many columns right from the left — column 0 is the far left.", "So Position(1, 2) means: down one row, over two columns.", "To ask whether you can stand on a cell, call terrain.is_traversable(Position(row, column))."]}, {"heading": "Terrain answers one question", "kind": "prose", "text": "Terrain answers exactly one question: is this cell walkable? The answer is yes only when two things are both true: the position is inside the grid, and the cell's character is '.'. That is the whole job. A wall is not an obstacle in some physical sense — it is just a cell where is_traversable returns False. There is no climbing, no breaking walls, no diagonal shortcuts. You step north, south, west, or east into a floor cell, or you stop."}, {"heading": "The #1 misconception: position order", "kind": "misconception", "text": "Misconception: a position is (x, y), like a graph. In this code it is not. Position takes row first, then column — and row 0 is the top, not the bottom. If you mentally swap them, every move is mirrored: up becomes right, down becomes left. When you read an AI-written project, getting this backwards turns a correct solution into an invisible bug."}, {"heading": "The invisible rules", "kind": "prose", "text": "The world also follows strict rules, and these are where broken AI-generated levels get caught. Every row must be the same length — otherwise the rectangle is not a rectangle. Every character must be '.' or '#'. And every floor cell must connect to the others in one unbroken region — no floating islands of floor cut off by walls. If a floor tile is unreachable, the level cannot be finished. The validator checks all of this, and so can you."}, {"heading": "Start, exit, and the snapshot", "kind": "prose", "text": "A level marks two special cells: start, where you begin, and exit, where you must arrive. They are always distinct cells. And at each moment of play you get a WorldSnapshot — a fixed, readable copy of the world at that turn. It bundles the terrain, the agent's current position, the turn number, what has been collected and defeated, and which actions are allowed right now. It is frozen: you can look at it, but nothing you do changes this particular copy. Every turn hands you a fresh one."}, {"heading": "Why defend the world", "kind": "callout", "text": "Why learn to read a world? Because in this project the world is data, not magic. It is text you can open and check. Look for a row with the wrong length, a stray character, a disconnected island of floor, or a start and exit that cannot connect. Catch one of those and you have found a real defect — and you have defended the project against an AI that almost made it look fine."}], "digest": "The world is frozen grid data: floor '.' and wall '#' cells, addressed as (row, column), and terrain answers one question — can you stand there?", "check": ["In the row '##.', which cells are floor and which are walls? What does terrain.is_traversable(Position(0, 2)) return?", "Why is Position(row, column) not the same as writing (x, y)? What goes wrong if you swap the two numbers?", "Imagine a floor tile on row 1 that no other floor cell touches. Why is that a problem, and which check would catch it?"]}, {"id": "scoring", "navLabel": "Scoring & limits", "hero": "Your score isn't about finishing — it's about how close you stayed to the cheapest honest route.", "intro": "When you run an adventure level, the game turns your choices into a single number: your score. This section shows you exactly how that number is computed, and why the details matter when you have to defend an AI-written project. By the end, you'll be able to compute a score by hand from a run's events, explain what the reference cost means, and see why \"just finish\" is the wrong strategy. You'll also meet the two hard limits, H and D, that keep a run finite. Everything here is read from the real code, not invented.", "concepts": [{"term": "Action (turn)", "plain": "One decision you make for the explorer — moving to a neighboring tile, waiting, or taking the exit. The code counts every accepted action and calls that number T.", "deeper": "The exit move itself counts as a turn, so T is not just walking moves."}, {"term": "Encounter penalty (P)", "plain": "If you step onto a tile holding an enemy, the game charges you a fixed penalty — a number added to your cost. P is the sum of every penalty you paid.", "deeper": "Penalties are set when the level is built; larger enemies cost more points."}, {"term": "Total cost (C)", "plain": "Your total cost is your turns plus your penalties: C = T + P. It measures how expensive your chosen route was, in effort plus damage."}, {"term": "Reference cost (L)", "plain": "The reference cost is the cheapest honest route through the level, computed for you before the run. It is the baseline that 'good' is measured against.", "deeper": "You earn points by staying near L — not by moving fast, and not by collecting the most."}, {"term": "Excess (E)", "plain": "Excess is how far above the reference cost you went: E = max(0, C - L). The max(0, ...) means going under L is not 'negative excess' — it triggers a separate flag.", "deeper": "This is the single number that actually moves your score down."}, {"term": "Base points, deduction rate, threshold (B, r, Q)", "plain": "You start with B base points, lose r points for each unit of excess, and the whole score collapses to zero once excess reaches Q.", "deeper": "B, r, and Q come from the tuning() function, which sizes them to the level's size: big levels get bigger B and Q, so a 'good' run is equally hard everywhere."}], "body": [{"heading": "What a score really measures", "kind": "prose", "text": "Every run ends with a number: the score. In this family, the score is not 'how much you collected' and not 'how fast you were.' It is a measure of how close your route came to the cheapest honest route through the level. Grasping that distinction is the whole game — and it is exactly what a reviewer will probe when they look at an AI-written project. If you can reproduce the calculation yourself, you can tell whether a score is fair or whether something in the code is quietly wrong."}, {"heading": "The calculation, step by step", "kind": "steps", "items": ["Count every accepted action — each move, wait, and the final exit — and call that T.", "Add every enemy penalty you paid, and call that P.", "Add them: C = T + P. That is your total cost.", "Compare C to the reference cost L. Excess is E = max(0, C - L).", "Start at base points B, add any artifact rewards A, then subtract r points for each unit of excess. That gives your score.", "Force the score to zero if any of these are true: the run never completed, excess reached Q, or you finished under the reference cost (a defect)."]}, {"heading": "The real numbers", "kind": "callout", "text": "These are not hypothetical. From the actual code, the simple straight passage (tier 0) ships with B = 100, r = 5, Q = 14, and a 32-turn cap H. The big combined world (tier 7) has B = 975, Q = 230, H = 512. Because tuning() grows B and Q with the level's size, a 'good' run costs about the same effort on every level. A run with C = 13 and L = 5 has E = 8 and scores 100 - 5*8 = 60; a run with C = 6 has E = 1 and scores 95."}, {"heading": "A toll road", "kind": "analogy", "text": "Think of the level as a toll highway. The reference cost L is the price of the cheapest honest route from entrance to exit, and you start with B dollars in your pocket. Every tile you walk costs $1, and stepping on an enemy adds its penalty. The moment your total bill passes L, every extra dollar is taken straight out of your B dollars, r at a time. Run the bill high enough — up to Q — and you are cleaned out: a flat zero."}, {"heading": "Two things that trip people up", "kind": "prose", "text": "First, artifacts are worth points: your reward A is added to the base before deductions, so grabbing a valuable artifact can legitimately cover extra wandering. Second, finishing faster than the reference cost is not a win. The code flags a completed run whose cost is below L as a defect and scores it zero. That is an anti-cheat guard: a real run should not beat the certified cheapest route, so a suspiciously fast finish is treated as invalid."}, {"heading": "The #1 misconception", "kind": "misconception", "text": "'Finishing is what matters — take your time and grab everything.' Wrong. You are scored on staying near the reference route, not on reaching the exit. Padding your walk with extra turns pushes excess up, and once excess reaches Q the entire score collapses to zero. More time is not more credit; it is slowly spending down your base points."}, {"heading": "The limits: H and D", "kind": "prose", "text": "Two hard stopwatch limits keep runs finite. H is the maximum number of turns you are allowed: hit it without exiting and the run is simply over, incomplete, and scores zero. D is the patrol deadline, used only in the tier-8 patrol worlds, where the patrol schedule is certified against this bound. Both exist so a player cannot stall forever to dodge enemies or wander indefinitely — and so a reviewer can rely on every run being bounded."}], "digest": "A score rewards staying near the cheapest honest route; extra turns and penalties cost points, and too much excess or a too-fast finish scores zero.", "check": ["A level has B = 100, r = 5, Q = 14. You finish a 13-turn run with no penalties, and the reference cost is 5. What is your score?", "Why does the code treat a run that finishes under the reference cost as a defect instead of a great run?", "Name the three conditions that each force a score of exactly zero.", "If you had unlimited turns, could you still fail a level? Explain using Q, E, and the zero condition."]}], "modules": {"code-character": {"title": "character.py", "code": "\"\"\"TODO: implement your character's immutable, canonical public identity.\"\"\"\nfrom src.api import CharacterDefinition\n\n\nclass Character:\n    \"\"\"Character(agent_id); expose a read-only str agent_id property.\"\"\"\n\n    def __init__(self, agent_id: str) -> None:\n        # Build the canonical definition up front so bad ids fail immediately.\n        self._definition = CharacterDefinition(agent_id)\n        self._agent_id = self._definition.agent_id\n\n    @property\n    def agent_id(self) -> str:\n        return self._agent_id\n", "note": "What to notice. The constructor doesn't just store the string — it builds a `CharacterDefinition` (line 10), which is the canonical validator. If the id is invalid, this line raises before anything else can happen. The `@property` (line 13) makes `agent_id` read-only: callers can read it but never reassign it. That's the whole module."}, "code-artifact": {"title": "artifact.py", "code": "\"\"\"TODO: implement initial artifact data; introductory gameplay has no artifacts.\"\"\"\nfrom src.api import ArtifactDefinition, Position\n\n\nclass Artifact:\n    \"\"\"Expose read-only canonical identity, position, and nonnegative value.\"\"\"\n\n    def __init__(self, artifact_id: str, position: Position, value: int) -> None:\n        # Build the canonical definition up front so bad ids/positions and\n        # negative values fail immediately instead of being silently clamped.\n        definition = ArtifactDefinition(artifact_id, position, value)\n        self._artifact_id = definition.artifact_id\n        self._position = definition.position\n        self._value = definition.value\n\n    @property\n    def artifact_id(self) -> str:\n        return self._artifact_id\n\n    @property\n    def position(self) -> Position:\n        return self._position\n\n    @property\n    def value(self) -> int:\n        return self._value\n", "note": "What to notice. Same wrapper pattern as character. The important line is 11: `ArtifactDefinition` rejects negative values and bad ids/positions. So a negative value can never slip through — it fails at construction instead of silently producing a broken reward."}, "code-enemy": {"title": "enemy.py", "code": "\"\"\"TODO: implement initial enemy data; introductory gameplay has no enemies.\"\"\"\nfrom src.api import EnemyDefinition, Position\n\n\nclass Enemy:\n    \"\"\"Expose read-only identity, position, and nonnegative encounter penalty.\"\"\"\n\n    def __init__(self, enemy_id: str, position: Position, encounter_penalty: int) -> None:\n        # Mirror Character/Artifact: validate through the canonical definition so\n        # bad ids/positions and negative penalties fail immediately.\n        definition = EnemyDefinition(enemy_id, position, encounter_penalty)\n        self._enemy_id = definition.enemy_id\n        self._position = definition.position\n        self._encounter_penalty = definition.encounter_penalty\n\n    @property\n    def enemy_id(self) -> str:\n        return self._enemy_id\n\n    @property\n    def position(self) -> Position:\n        return self._position\n\n    @property\n    def encounter_penalty(self) -> int:\n        return self._encounter_penalty\n", "note": "What to notice. Exact same pattern. Line 11 mirrors the validation — a negative penalty fails immediately. Note there's no \"health\" or \"attack\" anywhere: an enemy is just an id, a position, and a penalty. That's the whole evidence that ENGAGE isn't combat."}, "code-terrain": {"title": "terrain_generator.py", "code": "\"\"\"TODO: generate canonical terrain deterministically from specification and seed.\"\"\"\nimport random\n\nfrom src.api import Terrain, TerrainGenerationSpec, TerrainTopology\n\n\nclass TerrainGenerator:\n    \"\"\"Keep state local; identical inputs must also agree across fresh instances.\"\"\"\n\n    def __init__(self) -> None:\n        self._last_seed = None\n        self._last_spec = None\n        self._generated = 0\n\n    @staticmethod\n    def _neighbors(row, column):\n        return ((row - 1, column), (row + 1, column),\n                (row, column - 1), (row, column + 1))\n\n    def _straight_path(self, rng, rows, columns, target):\n        # A single line of floor on one axis. Prefer horizontal when it fits.\n        if columns >= target:\n            row = rng.randrange(rows)\n            start_column = rng.randrange(0, columns - target + 1)\n            return {(row, column) for column in range(start_column, start_column + target)}\n        column = rng.randrange(columns)\n        start_row = rng.randrange(0, rows - target + 1)\n        return {(row, column) for row in range(start_row, start_row + target)}\n\n    def _bent_path(self, rng, rows, columns, target):\n        # One L-shape spanning both axes: a horizontal arm plus a vertical arm\n        # sharing the corner, with total open cells == target.\n        for _ in range(200):\n            row = rng.randrange(rows)\n            column = rng.randrange(columns)\n            # horizontal length h in [2, columns-column], vertical v in [2, rows-row]\n            # with h + v - 1 == target.\n            v_min, v_max = 2, rows - row\n            h_min, h_max = 2, columns - column\n            low = max(h_min, target + 1 - v_max)\n            high = min(h_max, target + 1 - v_min)\n            if low <= high:\n                h = rng.randint(low, high)\n                v = target + 1 - h\n                cells = {(row, c) for c in range(column, column + h)}\n                cells |= {(r, column) for r in range(row + 1, row + v)}\n                return cells\n        # Degenerate fallback; real BENT specs always fit.\n        return self._straight_path(rng, rows, columns, target)\n\n    def _grow_tree(self, rng, rows, columns, target, acyclic=False):\n        # Grow a connected region by expanding a random frontier. For a tree,\n        # a new cell may touch exactly one open neighbor, which prevents cycles.\n        start = (rng.randrange(rows), rng.randrange(columns))\n        opened = {start}\n        frontier = [neighbor for neighbor in self._neighbors(*start)\n                    if 0 <= neighbor[0] < rows and 0 <= neighbor[1] < columns]\n        while len(opened) < target and frontier:\n            index = rng.randrange(len(frontier))\n            cell = frontier.pop(index)\n            connections = [neighbor for neighbor in self._neighbors(*cell)\n                           if neighbor in opened]\n            if acyclic and len(connections) != 1:\n                continue\n            if not connections:\n                continue\n            opened.add(cell)\n            for neighbor in self._neighbors(*cell):\n                if (0 <= neighbor[0] < rows and 0 <= neighbor[1] < columns\n                        and neighbor not in opened and neighbor not in frontier):\n                    frontier.append(neighbor)\n        return opened\n\n    @staticmethod\n    def _has_branch(opened):\n        for row, column in opened:\n            degree = sum((neighbor in opened) for neighbor in ((row - 1, column), (row + 1, column), (row, column - 1), (row, column + 1)))\n            if degree >= 3:\n                return True\n        return False\n\n or the same inputs. The `_last_*` fields (lines 12–13) are only diagnostics; they never drive randomness."}, "code-level": {"title": "level_generator.py", "code": "\"\"\"TODO: build a canonical level using the injected terrain generator.\"\"\"\nimport random\n\nfrom src.api import (\n    ArtifactDefinition, CharacterDefinition, EnemyDefinition, LevelDefinition,\n    LevelSpecification, Position, TerrainGeneratorContract, TerrainTopology,\n)\n\n\nclass LevelGenerator:\n    \"\"\"Use the supplied TerrainGeneratorContract; do not instantiate a replacement.\"\"\"\n\n    def __init__(self, terrain_generator: TerrainGeneratorContract) -> None:\n        self._generator = terrain_generator\n\n    def _open_tiles(self, terrain):\n        return [\n            (row, column)\n            for row in range(terrain.rows)\n            for column in range(terrain.columns)\n            if terrain.is_traversable(Position(row, column))\n        ]\n\n    def _degree_one(self, terrain, open_tiles):\n        result = []\n        for row, column in open_tiles:\n            degree = sum(\n                (row + dr, column + dc) in open_tiles\n                for dr, dc in ((0, 1), (0, -1), (1, 0), (-1, 0))\n            )\n            if degree == 1:\n                result.append((row, column))\n        return result\n\n    def _pick_endpoints(self, rng, specification, terrain, open_tiles):\n        topology = specification.terrain_spec.topology\n        if topology in (TerrainTopology.STRAIGHT_PATH, TerrainTopology.BENT_PATH):\n            ends = self._degree_one(terrain, open_tiles)\n            if len(ends) >= 2:\n                return Position(*ends[0]), Position(*ends[1])\n        # General / tree: start at the top-left open tile, then choose an exit\n        # whose route distance fits the requested bounds.\n        start = Position(*open_tiles[0])\n        low, high = specification.min_route_moves, specification.max_route_moves\n        for row, column in open_tiles[1:]:\n            candidate = Position(row, column)\n            if low <= candidate.manhattan_distance(start) <= high:\n                return start, candidate\n        return start, Position(*open_tiles[-1])\n\n    def _place_entities(self, rng, specification, open_tiles, start, exit_pos):\n        start_pair = (start.row, start.column)\n        exit_pair = (exit_pos.row, exit_pos.column)\n        artifact_blocked = set()\n        enemy_blocked = {start_pair}  # enemies never occupy the start\n        if not specification.allow_entities_on_endpoints:\n            artifact_blocked |= {start_pair, exit_pair}\n            enemy_blocked.add(exit_pair)\n        artifact_pool = [tile for tile in open_tiles if tile not in artifact_blocked]\n        enemy_pool = [tile for tile in open_tiles if tile not in enemy_blocked]\n        rng.shuffle(artifact_pool)\n        rng.shuffle(enemy_pool)\n        used = set()\n        artifacts = []\n        for index in range(specification.artifact_count):\n            if not artifact_pool:\n                break\n            tile = artifact_pool.pop()\n            if not specification.allow_entity_overlap:\n                while tile in used and artifact_pool:\n                    tile = artifact_pool.pop()\n                if tile in used:\n                    break\n            used.add(tile)\n            value = rng.randint(specification.artifact_value_min, specification.artifact_value_max)\n            artifacts.append(ArtifactDefinition(f\"ART-{index + 1}\", Position(*tile), value))\n        enemies = []\n        for index in range(specification.enemy_count):\n            if not enemy_pool:\n                break\n            tile = enemy_pool.pop()\n            if not specification.allow_entity_overlap:\n                while tile in used and enemy_pool:\n                    tile = enemy_pool.pop()\n                if tile in used:\n                    break\n            used.add(tile)\n            penalty = rng.randint(specification.enemy_penalty_min, specification.enemy_penalty_max)\n            enemies.append(EnemyDefinition(f\"ENM-{index + 1}\", Position(*tile), penalty))\n        return tuple(artifacts), tuple(enemies)\n\n    def generate_level(self, specification: LevelSpecification, seed: int) -> LevelDefinition:\n        rng = random.Random(seed)\n        terrain = self._generator.generate_terrain(specification.terrain_spec, seed)\n        open_tiles = self._open_tiles(terrain)\n        start, exit_pos = self._pick_endpoints(rng, specification, terrain, open_tiles)\n        artifacts, enemies = self._place_entities(rng, specification, open_tiles, start, exit_pos)\n        return LevelDefinition(\n            level_id=specification.level_id,\n            profile_id=specification.profile_id,\n            seed=seed,\n            terrain=terrain,\n            start=start,\n            exit=exit_pos,\n            character=CharacterDefinition(specification.agent_id),\n            artifacts=artifacts,\n            enemies=enemies,\n        )\n", "note": "One seed, one rng (line 93): the whole level uses a single `random.Random(seed)`, so endpoint choice, shuffling, and value rolls are all deterministic together."}, "code-controller": {"title": "controller.py", "code": "\"\"\"TODO: select one public action from each immutable world observation.\"\"\"\nimport heapq\n\nfrom src.api import Position, WorldAction, WorldActionType, WorldSnapshot\n\n\nclass AgentController:\n    \"\"\"A new controller is constructed for each run; arrival still needs EXIT.\"\"\"\n\n    def __init__(self) -> None:\n        self.turn_count = 0\n\n    @staticmethod\n    def _patrol_position(patrol, turn):\n        # The patrol moves once per accepted action, so its phase at `turn` is\n        # purely a function of the schedule and the number of accepted actions.\n        phase = (patrol.initial_phase + turn) % len(patrol.positions)\n        return patrol.positions[phase]\n\n    def _patrol_cells(self, state, turn):\n        return [self._patrol_position(patrol, turn) for patrol in state.level.patrols]\n\n    def _static_enemies(self, state):\n        # Enemies that own a patrol are dynamic and cannot be engaged; only the\n        # remaining static, undefeated enemies are clearable blockers.\n        patrol_ids = {patrol.enemy_id for patrol in state.level.patrols}\n        return [\n            enemy for enemy in state.level.enemies\n            if enemy.enemy_id not in state.defeated_enemy_ids\n            and enemy.enemy_id not in patrol_ids\n        ]\n\n    def _plan(self, state):\n        \"\"\"Lowest-cost path over (position, turn, defeated) states.\n\n        Every accepted action advances the patrol clock by one turn, so routes\n        are planned against the *future* positions of each patrol, not just the\n        current snapshot. Static enemies are entered by ENGAGEing them first\n        (which costs one action plus the encounter penalty); patrols are never\n        engaged — only timed around. Total cost is actions plus encounter\n        penalties, matching the workbench's scoring. Returns a list of\n        (action_type, target_id) steps, or None if the exit is unreachable.\n        \"\"\"\n        limit = state.deadline_turn if state.deadline_turn is not None else state.max_turns\n        start_defeated = frozenset(state.defeated_enemy_ids)\n        static_enemies = self._static_enemies(state)\n        start = (state.agent_position, state.turn, start_defeated)\n        dist = {start: 0}\n        previous = {start: None}\n        pending = [(0, start)]\n        goal = None\n        moves = ((0, 1, WorldActionType.MOVE_EAST), (0, -1, WorldActionType.MOVE_WEST),\n                 (1, 0, WorldActionType.MOVE_SOUTH), (-1, 0, WorldActionType.MOVE_NORTH))\n        while pending:\n            cost, current = heapq.heappop(pending)\n            if current not in dist or cost > dist[current]:\n                continue\n            position, turn, defeated = current\n            if posi Public entry — `choose_action` (line 113): this is called once per turn with a fresh snapshot, and must return exactly one action. Order matters: EXIT if on the exit (line 117), then COLLECT if there's an uncollected artifact under you and no patrol is about to arrive (lines 121–125), then follow the plan (line 126), else WAIT (line 130)."}}, "quiz": [{"q": "Why does the controller plan a route instead of always walking toward the exit?", "opts": [{"v": "a", "t": "Because it looks cooler."}, {"v": "b", "t": "Because walls, occupancy, and patrols can make the direct path impossible."}, {"v": "c", "t": "Because the exit moves."}], "a": "b", "r": "Correct: the grid isn't a straight line. Only search-based planning guarantees you actually reach the exit."}, {"q": "Walking onto an artifact's tile automatically collects it. True or false?", "opts": [{"v": "a", "t": "False — you must explicitly issue COLLECT."}, {"v": "b", "t": "True — stepping on it is enough."}], "a": "a", "r": "False. Collection is an explicit action on that tile. The object itself never awards points."}, {"q": "You can clear a patrol by engaging it.", "opts": [{"v": "a", "t": "Yes, same as a static enemy."}, {"v": "b", "t": "Only if it's adjacent."}, {"v": "c", "t": "No — patrols cannot be engaged; you must time around them."}], "a": "c", "r": "Correct. Patrols are immune to ENGAGE. The only way past is predicting their schedule."}, {"q": "After you take an accepted action, what happens to the patrol clock?", "opts": [{"v": "a", "t": "Nothing — patrols only move on EXIT."}, {"v": "b", "t": "It advances once, so patrols move — even on WAIT or COLLECT."}, {"v": "c", "t": "It advances only on moves."}], "a": "b", "r": "Correct. Every accepted action advances the patrol clock one step. WAIT is never 'free'."}, {"q": "A level is \"solvable\" because…", "opts": [{"v": "a", "t": "We hope it is."}, {"v": "b", "t": "The teacher said so."}, {"v": "c", "t": "Generation rules keep terrain connected and placement l /* ---------- deterministic PRNG (mulberry32) ---------- */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

  _bindWin(st){

    tb.addEventListener("pointerdown", e=>{
      if(e.target.closest(".win-ctl")) return;

        el.style.top  = Math.max(0, Math.min(window.innerHeight-56-24, t+(ev.clientY-sy)))+"px";
      };
      const up=()=>{ tb.removeEventListener("pointermove",move); tb.removeEventListener("pointerup",up); tb.removeEventListener("pointercancel",up); };

      tb.addEventListener("pointermove",move);
      tb.addEventListener("pointerup",up);
      tb.addEventListener("pointercancel",up);
    });

    el.querySelector(".btn-min").onclick = e=>{ e.stopPropagation(); this.minimize(st); };
    el.querySelector(".btn-max").onclick = e=>{ e.stopPropagation(); this.maximize(st); };
  },

  _focus(st){
    if(st.minimized) return;

    st.el.classList.add("focus");

  },

  minimize(st){
    st.minimized = true; st.el.classList.add("min"); st.el.classList.remove("focus");
    this._syncTaskbar();
  },
  restore(st){
    st.minimized = false; st.el.classList.remove("min"); this._focus(st);
  },
  maximize(st){
    if(st.maximized){ st.maximized=false; st.el.classList.remove("max");

      st.el.style.width=st.restore.w+"px"; st.el.style.height=st.restore.h+"px";
    } else {
      st.restore={ x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight };
      st.maximized=true; st.el.classList.add("max");
      st.el.style.width=""; st.el.style.height=""; st.el.style.left=""; st.el.style.top="";
    }
    this._focus(st);
  },
  close(st){
    if(st._onclose) try{ st._onclose(); }catch(e){}

    const i=_windows.indexOf(st); if(i>=0) _windows.splice(i,1);

  },
  focus(id){ const st=_byId[id]; if(st) this._focus(st); },
  toggle(id){ const st=_byId[id]; if(!st) return; if(st.minimized) this.restore(st); else this.minimize(st); },

  _syncTaskbar(){

      box.appendChild(b);
    });
  },

  winBar(){ return window.innerHeight-56; },
  bounds(){ return {w:window.innerWidth, h:window.innerHeight-56}; }
};

window.MM = WM;
window.TERRAIN = TERRAIN;
window.mulberry32 = mulberry32;
window.__fmt = fmt;
window.__winCount = ()=>_winCount;
})();

      let j=i+1, ch=c, trip=false;
      if(src[j]===ch && src[j+1]===ch){ trip=true; j+=2; }
      while(j<n){
        if(src[j]==='\\'){ j+=2; continue; }
        if(src[j]===ch){ if(!trip){ j++; break; } if(src[j+1]===ch&&src[j+2]===ch){ j+=3; break; } }
        j++;

      out+='<span class="tok-str">'+esc(src.slice(i,j))+'</span>'; i=j;
    } else if(/[A-Za-z_]/.test(c)){
      let j=i; while(j<n && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w=src.slice(i,j);

      else if(PY_BI.has(w)) out+='<span class="tok-bi">'+esc(w)+'</span>';

      let j=i; while(j<n && /[0-9A-Za-z_.]/.test(src[j])) j++;
      out+='<span class="tok-num">'+esc(src.slice(i,j))+'</span>'; i=j;
    } else {
      out+=esc(c); i++;

  }

}

    case "glossary": WM.openApp("glossary"); break;
    case "lab": WM.openApp("lab"); break;
    case "pipeline": WM.openApp("pipeline"); break;
    case "theme":{
      const th=(arg[0]||"").toLowerCase();
      if(th==="dark"||th==="light"){ document.documentElement.dataset.theme=th; TERM.write('theme → '+th); }
      else TERM.write('usage: theme dark | light');
      break;
    }
    case "clear": TERM.linesEl.innerHTML=""; break;
    case "exit":{ const w=TERM.el.closest(".win"); const st=window.__getWin && window.__getWin(w.id); WM.close(st); break; }
    case "about": TERM.write('ADVENTURE/OS v2.1 — a study OS for the <span class="ok">Adventure Workbench</span>. Everything runs in your browser: no server, no build step.'); break;
    default:
      if(cmd) TERM.write('<span class="err">'+fmt.esc(cmd)+': command not found. Try help.</span>');
  }
  TERM.scroll();
}

WM.register("lab", {
  title:"Terrain Lab", icon:"lab", width:760, height:560,
  render(body){
    body.className="win-body app";
    body.innerHTML =
      '<div class="lab-wrap">'+
        '<h2 class="app-title">Terrain Lab</h2>'+
        '<p class="app-sub">Generate a world by topology + seed and watch determinism. Same seed always carves the same map — flip the seed and the whole world changes.</p>'+
        '<div class="lab-controls">'+
          '<div class="lab-field"><label>Topology</label><select id="labtopo">'+
            TERRAIN.topologies.map(t=>'<option>'+t+'</option>').join("")+
          '</select></div>'+
          '<div class="lab-field"><label>Seed</label><input id="labseed" type="number" value="11" min="0" max="99999"></div>'+
          '<div class="lab-field"><label>Rows</label><input id="labrows" type="number" value="9" min="5" max="18"></div>'+
          '<div class="lab-field"><label>Cols</label><input id="labcols" type="number" value="12" min="6" max="24"></div>'+
          '<button class="lab-btn" id="labgo">Generate</button>'+
        '</div>'+
        '<div class="lab-canvas-wrap"><canvas id="labCanvas" width="600" height="450"></canvas></div>'+
        '<div class="lab-legend">'+
          '<span><i style="background:#232c4a"></i>wall</span>'+
          '<span><i style="background:#e9b45c"></i>floor</span>'+
          '<span><i style="background:#57e6b5"></i>exit</span>'+
          '<span><i style="background:#70a4d0"></i>start</span>'+
        '</div>'+
        '<div class="lab-stats" id="labstats"></div>'+
      '</div>';
    const cv = D("labCanvas"), ctx = cv.getContext("2d");
    function draw(){
      const topo = D("labtopo").value;
      const seed = parseInt(D("labseed").value||"11",10);
      const rows = Math.min(18,Math.max(5,parseInt(D("labrows").value)||9));
      const cols = Math.min(24,Math.max(6,parseInt(D("labcols").value)||12));
      const t = TERRAIN.generate(topo, seed, rows, cols);
      const pad=10, W=cv.width, H=cv.height;
      const cw=(W-pad*2)/cols, chh=(H-pad*2)/rows;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = "#0a0e1c"; ctx.fillRect(0,0,W,H);
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const x=pad+c*cw, y=pad+r*chh;
          if(t.open[r*cols+c]){
            ctx.fillStyle = r===t.start[0]&&c===t.start[1] ? "#4388b8"
              : (r===t.end[0]&&c===t.end[1] ? "#3ec99a" : "#2c3a66");
            ctx.fillRect(x+1,y+1,cw-2,chh-2);
          } else {
            ctx.fillStyle = "#151c34"; ctx.fillRect(x+1,y+1,cw-2,chh-2);
          }
          ctx.strokeStyle="#0a0e1c"; ctx.strokeRect(x+0.5,y+0.5,cw,chh);
        }
      }
      // start/end labels
      ctx.fillStyle="#04060d"; ctx.font="600 12px 'IBM Plex Mono',monospace"; ctx.textAlign="center";
      ctx.fillText("S", pad+t.start[1]*cw+cw/2, pad+t.start[0]*chh+chh/2+4);
      ctx.fillText("E", pad+t.end[1]*cw+cw/2, pad+t.end[0]*chh+chh/2+4);
      const openCount = t.open.filter(Boolean).length;
      const stats = D("labstats");
      stats.innerHTML =
        '<span>topology · '+topo+'</span>'+
        '<span>seed · '+seed+'</span>'+
        '<span>grid · '+rows+'×'+cols+'</span>'+
        '<span>open · '+openCount+'/'+(rows*cols)+' cells</span>';
    }
    D("labgo").onclick = draw;
    D("labtopo").onchange = draw;
    ["labseed","labrows","labcols"].forEach(id=>{ D(id).addEventListener("input", draw); });
    draw();
  }
});

WM.register("referee", {
  title:"Referee — self-check", icon:"referee", width:680, height:560,
  render(body){
    body.className="win-body app";
    body.innerHTML = '<div class="quiz-wrap" id="quizwrap"></div>';
    const wrap = D("quizwrap");
    const qs = DATA.quiz || [];
    const esc = fmt.esc;
    let state = qs.map(()=>({chosen:null}));
    let submitted = false;
    function render(){
      let html = '<h2 class="app-title">Referee</h2>';
      html += '<p class="app-sub">Five questions, graded like the workbench referee would. Answer all, then grade — each one explains the reasoning.</p>';
      html += '<div class="quiz-progress"><i style="width:'+(submitted?100:0)+'%"></i></div>';
      qs.forEach((q,i)=>{
        html += '<div class="quiz-q'+(submitted?(state[i].chosen===q.a?" correct":" wrong"):"")+'" id="qq'+i+'">'+
          '<div class="qtitle">'+(i+1)+'. '+esc(q.q)+'</div>';
        q.opts.forEach(o=>{
          html += '<label><input type="radio" name="qq'+i+'" value="'+esc(o.v)+'"'+(state[i].chosen===o.v?" checked":"")+(submitted?" disabled":"")+'>'+esc(o.t)+'</label>';
        });
        html += '<div class="reveal">'+esc(q.r)+'</div></div>';
      });
      if(!submitted){
        html += '<button class="quiz-btn" id="quizgrade">Grade it</button>';
      } else {
        let correct=0; qs.forEach((q,i)=>{ if(state[i].chosen===q.a) correct++; });
        html += '<div class="quiz-score"><div class="big">'+correct+'/'+qs.length+'</div>'+
          '<p style="color:var(--fg2);margin:4px 0 0">'+(correct===qs.length?"Flawless. The referee would be proud.":correct>=3?"Solid. You understood the shape of it.":"Worth a re-read of the expeditions.")+'</p>'+
          '<button class="quiz-btn" id="quizagain">Take again</button></div>';
      }
      wrap.innerHTML = html;
      wrap.querySelectorAll("input[type=radio]").forEach(input=>{
        input.addEventListener("change", ()=>{
          const m = input.name.match(/^qq(\d+)$/);
          if(m) state[+m[1]].chosen = input.value;
        });
      });
      const grade = D("quizgrade");
      if(grade) grade.onclick = ()=>{ submitted=true; render(); };
      const again = D("quizagain");
      if(again) again.onclick = ()=>{ state = qs.map(()=>({chosen:null})); submitted=false; render(); };
    }
    render();
  }
});

WM.register("glossary", {

        list.appendChild(card);
      });
    }
    q.addEventListener("input", render);
    render();
  }
});

</script>
  <script>(function(){
    var WM=window.WM, APP_LIST=window.APP_LIST, D=function(id){return document.getElementById(id);};
    /* contours */
    (function(){
      var svg=D("contours"), NS="http://www.w3.org/2000/svg";
      var W=window.innerWidth, H=window.innerHeight;
      svg.setAttribute("viewBox","0 0 "+W+" "+H);
      var cx=W*0.72, cy=H*0.30;
      for(var i=0;i<9;i++){
        var r0=(i+1)*50+i*16;
        var d="M "+(cx+r0)+" "+cy;
        var steps=96;
        for(var s=1;s<=steps;s++){
          var a=s/steps*Math.PI*2;
          var rr=r0+Math.sin(a*4+i)*9*(i%3+1)*0.55+Math.sin(a*2)*4;
          var x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*0.78;
          d+=" L "+x.toFixed(1)+" "+y.toFixed(1);
        }
        d+=" Z";
        var p=document.createElementNS(NS,"path");
        p.setAttribute("d",d); svg.appendChild(p);
      }
    })();
    /* desktop icons */
    APP_LIST.forEach(function(app){
      var b=document.createElement("button");
      b.className="dicon";
      b.innerHTML='<span class="ico">'+WM.icon(app.icon,26)+'</span><span>'+app.name+'</span>';
      b.onclick=function(){ WM.openApp(app.id); };
      D("icons").appendChild(b);
    });
    /* start menu */
    var menu=D("startmenu"), startBtn=D("startbtn");
    function closeMenu(){ menu.classList.remove("open"); }
    (function buildMenu(){
      menu.innerHTML='<h4>Adventure /OS</h4>';
      APP_LIST.forEach(function(app){
        var b=document.createElement("button");
        b.className="sm-item";
        b.innerHTML='<span class="ico">'+WM.icon(app.icon,17)+'</span><div>'+app.name+'<small>'+app.desc+'</small></div>';
        b.onclick=function(){ closeMenu(); WM.openApp(app.id); };
        menu.appendChild(b);
      });
      var sep=document.createElement("div"); sep.className="sm-sep"; menu.appendChild(sep);
      var theme=document.createElement("button"); theme.className="sm-item";
      theme.innerHTML='<span class="ico">'+WM.icon("adv",17)+'</span><div>Toggle theme<small>dark / light</small></div>';
      theme.onclick=function(){ closeMenu(); toggleTheme(); };
      menu.appendChild(theme);
    })();
    startBtn.onclick=function(e){ e.stopPropagation(); menu.classList.toggle("open"); };
    document.addEventListener("pointerdown",function(e){ if(!menu.contains(e.target)) closeMenu(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeMenu(); });
    /* theme */
    function toggleTheme(){
      var cur=document.documentElement.dataset.theme||"dark";
      var next=cur==="dark"?"light":"dark";
      document.documentElement.dataset.theme=next;
      try{ localStorage.setItem("advos-theme",next); }catch(e){}
    }
    try{ var saved=localStorage.getItem("advos-theme"); if(saved) document.documentElement.dataset.theme=saved; }catch(e){}
    D("themetray").onclick=toggleTheme;
    /* clock */
    function tick(){
      var n=new Date();
      var hh=("0"+n.getHours()).slice(-2), mm=("0"+n.getMinutes()).slice(-2);
      var dv=n.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      D("clkhh").textContent=hh+":"+mm; D("clkdate").textContent=dv;
      var wc=D("wchh"), wd=D("wcdate");
      if(wc) wc.textContent=hh+":"+mm;
      if(wd) wd.textContent=dv;
    }
    setInterval(tick,15000); tick();
    /* contours follow resize */
    var csvg=D("contours");
    window.addEventListener("resize", function(){
      csvg.setAttribute("viewBox","0 0 "+window.innerWidth+" "+window.innerHeight);
    });
    /* go */
    try{ WM.boot(); }catch(e){ var b=D("boot"); if(b) b.remove(); }
  })();</script>
